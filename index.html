/* ------------------------------------------------------------------ */
/*  Seeded value/simplex-ish noise                                     */
/* ------------------------------------------------------------------ */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Classic 2D simplex noise with a seeded permutation table.
class SimplexNoise {
  constructor(seed) {
    const rng = mulberry32(seed >>> 0);
    const p = new Uint8Array(256);
    for (let i = 0; i < 256; i++) p[i] = i;
    for (let i = 255; i > 0; i--) {
      const j = (rng() * (i + 1)) | 0;
      [p[i], p[j]] = [p[j], p[i]];
    }
    this.perm = new Uint8Array(512);
    this.permMod12 = new Uint8Array(512);
    for (let i = 0; i < 512; i++) {
      this.perm[i] = p[i & 255];
      this.permMod12[i] = this.perm[i] % 12;
    }
  }
  noise2D(xin, yin) {
    const grad3 = SimplexNoise.grad3;
    const F2 = 0.5 * (Math.sqrt(3) - 1);
    const G2 = (3 - Math.sqrt(3)) / 6;
    const { perm, permMod12 } = this;
    let n0 = 0, n1 = 0, n2 = 0;
    const s = (xin + yin) * F2;
    const i = Math.floor(xin + s);
    const j = Math.floor(yin + s);
    const t = (i + j) * G2;
    const X0 = i - t, Y0 = j - t;
    const x0 = xin - X0, y0 = yin - Y0;
    let i1, j1;
    if (x0 > y0) { i1 = 1; j1 = 0; } else { i1 = 0; j1 = 1; }
    const x1 = x0 - i1 + G2, y1 = y0 - j1 + G2;
    const x2 = x0 - 1 + 2 * G2, y2 = y0 - 1 + 2 * G2;
    const ii = i & 255, jj = j & 255;
    let t0 = 0.5 - x0 * x0 - y0 * y0;
    if (t0 >= 0) { const gi0 = permMod12[ii + perm[jj]] * 3; t0 *= t0; n0 = t0 * t0 * (grad3[gi0] * x0 + grad3[gi0 + 1] * y0); }
    let t1 = 0.5 - x1 * x1 - y1 * y1;
    if (t1 >= 0) { const gi1 = permMod12[ii + i1 + perm[jj + j1]] * 3; t1 *= t1; n1 = t1 * t1 * (grad3[gi1] * x1 + grad3[gi1 + 1] * y1); }
    let t2 = 0.5 - x2 * x2 - y2 * y2;
    if (t2 >= 0) { const gi2 = permMod12[ii + 1 + perm[jj + 1]] * 3; t2 *= t2; n2 = t2 * t2 * (grad3[gi2] * x2 + grad3[gi2 + 1] * y2); }
    return 70 * (n0 + n1 + n2); // ~[-1,1]
  }
}

const ramp = [
  { t: 0.00, c: new THREE.Color(0xffcaa0) }, // warm valley floor
  { t: 0.18, c: new THREE.Color(0xe98b66) },
  { t: 0.42, c: new THREE.Color(0xb24b63) }, // red flank
  { t: 0.66, c: new THREE.Color(0x6a5a9c) }, // purple
  { t: 0.85, c: new THREE.Color(0x5b86d6) }, // blue
  { t: 1.00, c: new THREE.Color(0xeaf2ff) }, // snowy peak

  t = Math.min(1, Math.max(0, t));
  for (let i = 0; i < ramp.length - 1; i++) {
    const a = ramp[i], b = ramp[i + 1];
    if (t <= b.t) {
      const k = (t - a.t) / (b.t - a.t);
      tmpA.copy(a.c); tmpB.copy(b.c);
      return out.copy(tmpA).lerp(tmpB, k);
    }
  }
  return out.copy(ramp[ramp.length - 1].c);
}

let noise = new SimplexNoise(params.seed);

const smoothstep = (e0, e1, x) => {
  const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0)));
  return t * t * (3 - 2 * t);
};

// winding amplitude grows toward the back so the path switchbacks up the mountain
function windFactor(u) {
  return 1 + (params.windGrowthBack - 1) * Math.pow(Math.min(1, Math.max(0, u)), params.windGrowthCurve);
}
// lateral steer that pushes the path to one side as it nears the peak, so it
// routes around the summit instead of climbing straight over it.
function pathSkirt(z) {
  if (!params.peakEnable || !params.peakSkirt) return 0;
  const L = params.length;
  const u = (z + L / 2) / L;
  const spread = Math.max(0.01, (params.peakRadius / L) * 1.1);
  const g = Math.exp(-Math.pow((u - params.peakPos) / spread, 2));
  return params.peakSkirt * params.width * 0.3 * g;
}
// centerline x at a given z. grown=false gives the un-amplified, un-skirted path
// (used to anchor the mountain so the trail winds across it, not moves it).
function pathCenterX(z, grown = true) {
  const L = params.length;
  const u = (z + L / 2) / L; // 0..1 front->back
  const amp = params.windAmplitude * (grown ? windFactor(u) : 1);
  let x = amp * Math.sin(u * Math.PI * 2 * params.windFrequency + params.windPhase);
  if (grown) x += pathSkirt(z);
  const lim = params.width * 0.47;
  return Math.max(-lim, Math.min(lim, x));
}

// section is about `climbGrade` percent (rise / horizontal run).
function altitudeProfile(u, L) {
  const N = params.climbWaves;
  if (params.climbGrade <= 0 || N <= 0) return 0;
  const lambda = L / N;                                    // wavelength (world units)
  const A = (params.climbGrade / 100) * lambda / (2 * Math.PI); // amplitude for that grade
  return A * Math.sin(2 * Math.PI * N * u + params.windPhase);

// easing for the base level ramp (0..1 in -> 0..1 out)
function levelEase(u) {
  const p = params.levelCurvePower;
  switch (params.levelCurve) {
    case 'ease-in': return Math.pow(u, p);
    case 'ease-out': return 1 - Math.pow(1 - u, p);
    case 'ease-in-out': return u < 0.5 ? 0.5 * Math.pow(2 * u, p) : 1 - 0.5 * Math.pow(2 * (1 - u), p);
    case 'smoothstep': return u * u * (3 - 2 * u);
    case 'exponential': { const k = p * 2; return (Math.exp(k * u) - 1) / (Math.exp(k) - 1); }
    default: return u; // linear
  }

// background mountain: a radial peak at the far end, centred on the path,
// that the dunes and the trail converge into (keeps the path continuous up it)
function peakAt(x, z) {
  if (!params.peakEnable || params.peakHeight <= 0) return 0;
  const L = params.length;
  const cz = -L / 2 + params.peakPos * L;
  const cx = pathCenterX(Math.min(L / 2, cz), false); // anchor mountain to the un-wound path
  const dx = (x - cx) / Math.max(1, params.peakRadius * params.peakAspect);
  const dz = (z - cz) / Math.max(1, params.peakRadius);
  const d = Math.sqrt(dx * dx + dz * dz);
  if (d >= 1) return 0;
  const f = Math.pow(1 - d, params.peakCurve);
  const ridge = 1 + params.peakRidge * (fbm(x, z) - 0.5) * 2;
  return params.peakHeight * f * Math.max(0, ridge);
}

// floor height at a given z: net climb toward the back + rolling up/down
function floorYAt(z) {
  const L = params.length;
  const u = (z + L / 2) / L;
  const ue = Math.min(1, Math.max(0, u)); // clamp so the back extension holds the end level
  return params.floorHeight
    + params.pathSlope * smoothstep(0, 1, u)
    + (params.levelStart + (params.levelEnd - params.levelStart) * levelEase(ue)) // base level ramp
    + altitudeProfile(u, L);
}

// fractal noise in [0,1]
function fbm(x, z) {
  let amp = 1, freq = 1, sum = 0, norm = 0;
  // domain warp so ridges flow rather than look like static blobs
  if (params.warp > 0) {
    const wx = noise.noise2D(x * params.noiseScale * 0.5 + 11.3, z * params.noiseScale * 0.5);
    const wz = noise.noise2D(x * params.noiseScale * 0.5, z * params.noiseScale * 0.5 + 7.7);
    x += wx * params.warp / params.noiseScale * 0.15;
    z += wz * params.warp / params.noiseScale * 0.15;
  }
  for (let o = 0; o < params.octaves; o++) {
    let n = noise.noise2D(x * params.noiseScale * freq, z * params.noiseScale * freq);
    if (params.ridged) { n = 1 - Math.abs(n); n *= n; }
    else { n = n * 0.5 + 0.5; }
    sum += n * amp;
    norm += amp;
    amp *= params.persistence;
    freq *= params.lacunarity;

  // smoothing>1 rounds the tops (gentle hills); <1 sharpens
  if (params.smoothing !== 1) h = Math.pow(h, params.smoothing);
  return h;
}

      const sn = noise.noise2D(px, pz); // -1..1
      if (type === 'ridged') { n = 1 - Math.abs(sn); n = n * n; }
      else if (type === 'billow') n = Math.abs(sn);
      else if (type === 'turbulence') { n = Math.abs(sn); n = n * n; }
      else n = sn * 0.5 + 0.5; // fbm
    }
    sum += n * amp; norm += amp; amp *= 0.5; freq *= 2.0;
  }
  return sum / norm;
}

// full height + which fraction of mountain is present (0 on path, 1 on peaks)
function sample(x, z) {
  const cx = pathCenterX(z);
  const dist = Math.abs(x - cx);
  const half = params.pathWidth / 2;
  let valley = smoothstep(half, half + params.wallWidth, dist); // 0 on path, 1 far
  valley = Math.pow(valley, params.wallCurve);
  const floorY = floorYAt(z);
  const gu = Math.min(1, Math.max(0, (z + params.length / 2) / params.length)); // 0 front .. 1 back
  const growth = params.growthFront + (params.growthBack - params.growthFront) * Math.pow(gu, params.growthCurve);
  const mountain = fbm(x, z) * params.mountainHeight * growth;
  // side falloff: relief (and optionally altitude) tapers toward the left/right
  // edges so the landscape resolves naturally instead of cutting off.
  const halfW = params.width * 0.5;
  const swRaw = 1 - smoothstep(halfW * (1 - params.edgeFalloff), halfW, Math.abs(x));
  const sw = Math.pow(swRaw, params.edgeCurve);
  // back falloff: relief/altitude taper toward the far edge to shape the horizon
  const totalLen = params.length + params.backExtend;
  const bu = (z + params.length / 2) / totalLen; // 0 front .. 1 far edge
  const bwRaw = 1 - smoothstep(1 - params.backFalloff, 1.0, bu);
  const bw = Math.pow(bwRaw, params.backCurve);
  const w = sw * bw; // combined relief/peak weight
  const groundNoise = (noise.noise2D(x * 0.08, z * 0.08)) * params.floorNoise;
  const reliefAbove = groundNoise * (1 - valley) + mountain * valley;
  const yDunes = floorY + reliefAbove * w;
  // local height: 0 at the valley floor -> 1 at a full dune peak (excludes the big mountain)
  const denom = params.mountainHeight * Math.max(0.0001, growth);
  const relHeight = Math.min(1, Math.max(0, (reliefAbove * sw) / denom));
  const peakV = peakAt(x, z);
  // fine detail: only on the background mountain (gated by peak presence)
  let detail = 0;
  if (params.detailAmount > 0 && params.peakHeight > 0) {
    const peakN = Math.min(1, peakV / params.peakHeight);
    const mask = Math.min(1, peakN * (1 + params.detailPeakBoost)); // reach down the flanks
    detail = (detailNoise(x, z) - 0.5) * params.detailAmount * valley * w * mask;
  }
  const y = yDunes + peakV * w - (1 - swRaw) * params.edgeDrop - (1 - bwRaw) * params.backDrop + detail;
  return { y, valley, relHeight };
}

const standardMaterial = () => new THREE.MeshStandardMaterial({
  vertexColors: true, roughness: 0.92, metalness: 0.0,
  wireframe: params.wireframe, flatShading: false,
});

const LINE_BLENDS = { add: 0, multiply: 1, screen: 2, overlay: 3, normal: 4, 'color-dodge': 5, lighten: 6, 'soft-light': 7, glow: 8 };
const DUO_MODES = { facing: 0, noise: 1, height: 2 };
const STRIATION_MAPS = { height: 0, lengthwise: 1, across: 2, 'from path': 3, radial: 4, angular: 5, flow: 6, 'path-parallel': 7 };
const NOISE_TYPES = { fbm: 0, ridged: 1, billow: 2, cellular: 3, cracks: 4, marble: 5, bands: 6, turbulence: 7 };

const TERRAIN_VERT = /* glsl */`
  attribute float aValley;
  attribute float aRelHeight;
  varying vec3 vWorldNormal;
  varying vec3 vWorldPos;
  varying float vValley;
  varying float vY;
  varying float vRel;
  void main() {
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vWorldPos = wp.xyz;
    vWorldNormal = normalize(mat3(modelMatrix) * normal);
    vValley = aValley;
    vRel = aRelHeight;
    vY = position.y;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }
`;
const TERRAIN_FRAG = /* glsl */`
  precision highp float;
  uniform vec3 uWarm, uCool, uPath, uLineColor, uHaze, uRimColor;
  uniform float uLineFreq, uLineWidth, uLineIntensity, uLineFromSurface, uLineBoost, uLineTrailMix, uLineFar, uLineEmissive, uLineFlowScale, uLineFlowWarp, uLineLight, uLineLightPow;
  uniform int uLineBlend, uRimBlend, uLineMap;
  uniform float uMinY, uMaxY, uFogNear, uFogFar, uFogHeight, uFogHeightBand, uFogHeightFade;
  uniform float uValleyFog, uValleyTop, uValleyBottom;
  uniform vec3 uValleyColor;
  uniform float uBlendLo, uBlendHi, uBalance, uRimPower, uRimIntensity;
  uniform float uWindAmp, uWindFreq, uWindPhase, uLen, uWindGrowth, uWindGrowthCurve;
  uniform float uPeakSkirt, uPeakPos, uPeakRadius;
  uniform float uTrailWidth, uTrailSpill, uTrailGlow, uTrailSpacing, uTrailLineWidth, uTrailClear, uTrailStyle, uTrailGap;
  uniform float uTrailMidStr, uTrailDotsOn, uTrailDotInt, uTrailDotCount, uTrailDotSpeed, uTrailShrink, uTrailShrinkCurve;
  uniform vec3 uTrailMid;
  uniform vec3 uLightDir;
  uniform float uSunEnable, uSunIntensity, uAmbient;
  uniform vec3 uSunDir, uSunColor;
  uniform sampler2D uHeightMap;
  uniform float uShadowEnable, uShadowStrength, uShadowDist, uShadowSoft, uShadowBias, uWidth, uShadowHard, uShadowDarken, uZSpan;
  #define SHADOW_STEPS 48
  // heightfield self-shadow: march toward the sun, sampling the baked heights
  float shadowFactor(vec3 wp, vec3 sdir) {

    float t = uShadowBias;
    float res = 1.0;
    for (int i = 0; i < SHADOW_STEPS; i++) {
      t += stepLen;
      vec3 p = wp + sdir * t;
      vec2 uv = vec2((p.x + uWidth * 0.5) / uWidth, (p.z + uLen * 0.5) / uZSpan);
      if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) break;

      if (uShadowHard > 0.5) {
        if (clear < 0.0) { res = 0.0; break; }     // hard: crisp binary occlusion
      } else {

        if (res < -0.5) { res = -1.0; break; }

  }
  uniform int uDuoMode, uDuoNoiseType;
  uniform float uDuoNoiseScale, uDuoNoiseWarp, uDuoHeight, uDuoSeed;
  uniform float uTime, uFlowFog, uFlowIntensity, uFlowDensity, uFlowScale, uFlowSpeed, uFlowReach;
  uniform vec3 uFlowColor;
  float h31(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
  float vnoise(vec3 x){

    return mix(mix(mix(h31(i+vec3(0,0,0)), h31(i+vec3(1,0,0)), f.x),
                   mix(h31(i+vec3(0,1,0)), h31(i+vec3(1,1,0)), f.x), f.y),
               mix(mix(h31(i+vec3(0,0,1)), h31(i+vec3(1,0,1)), f.x),
                   mix(h31(i+vec3(0,1,1)), h31(i+vec3(1,1,1)), f.x), f.y), f.z);
  }

  float ridged3(vec3 p){ float s=0.0,a=0.5; for(int i=0;i<5;i++){ float n=1.0-abs(vnoise(p)*2.0-1.0); s+=a*n*n; p*=2.02; a*=0.5; } return s; }
  float billow3(vec3 p){ float s=0.0,a=0.5; for(int i=0;i<5;i++){ float n=abs(vnoise(p)*2.0-1.0); s+=a*n; p*=2.02; a*=0.5; } return s; }
  float worley3(vec3 p){
    vec3 ip=floor(p), fp=fract(p); float d=1.0;
    for(int z=-1;z<=1;z++) for(int y=-1;y<=1;y++) for(int x=-1;x<=1;x++){
      vec3 g=vec3(float(x),float(y),float(z));
      vec3 o=vec3(h31(ip+g), h31(ip+g+31.0), h31(ip+g+71.0));
      vec3 r=g+o-fp; d=min(d, dot(r,r));
    }

  }
  float worleyEdge3(vec3 p){
    vec3 ip=floor(p), fp=fract(p); float d1=1.0, d2=1.0;
    for(int z=-1;z<=1;z++) for(int y=-1;y<=1;y++) for(int x=-1;x<=1;x++){
      vec3 g=vec3(float(x),float(y),float(z));
      vec3 o=vec3(h31(ip+g), h31(ip+g+31.0), h31(ip+g+71.0));
      vec3 r=g+o-fp; float d=dot(r,r);
      if(d<d1){ d2=d1; d1=d; } else if(d<d2){ d2=d; }

    return clamp(sqrt(d2)-sqrt(d1), 0.0, 1.0);
  }

    p += vec3(uDuoSeed * 17.3, uDuoSeed * 31.7, uDuoSeed * 8.1);   // seed shifts the field
    if(uDuoNoiseWarp > 0.0){ vec3 w=vec3(fbm3(p+1.3), fbm3(p+5.2), fbm3(p+9.7)); p += (w-0.5)*uDuoNoiseWarp; }
    if(uDuoNoiseType==1) return ridged3(p);
    if(uDuoNoiseType==2) return billow3(p);
    if(uDuoNoiseType==3) return worley3(p);                         // cellular
    if(uDuoNoiseType==4) return worleyEdge3(p);                     // cracks (cell edges)
    if(uDuoNoiseType==5) return 0.5 + 0.5*sin((p.x+p.z)*0.5 + fbm3(p)*6.2831853); // marble
    if(uDuoNoiseType==6) return smoothstep(0.35, 0.65, 0.5 + 0.5*sin(fbm3(p)*10.0)); // bands
    if(uDuoNoiseType==7) return abs(fbm3(p)*2.0 - 1.0);             // turbulence (sharp veins)
    return fbm3(p);
  }
  // blend layer s onto b with opacity a using mode m
  vec3 blendMode(vec3 b, vec3 s, float a, int m){
    vec3 r;
    if(m==1) r = b * s;                                                   // multiply
    else if(m==2) r = 1.0 - (1.0-b)*(1.0-s);                              // screen
    else if(m==3) r = mix(2.0*b*s, 1.0-2.0*(1.0-b)*(1.0-s), step(0.5,b)); // overlay
    else if(m==4) r = s;                                                  // normal
    else if(m==5) r = min(b / max(vec3(1e-3), 1.0 - s), vec3(6.0));       // color dodge
    else if(m==6) r = max(b, s);                                          // lighten
    else if(m==7) r = mix(2.0*b*s + b*b*(1.0-2.0*s), sqrt(b)*(2.0*s-1.0)+2.0*b*(1.0-s), step(0.5,s)); // soft light
    else if(m==8) r = b * (1.0 + s);                                      // glow (brighten base by line, keeps hue)
    else r = b + s;                                                       // add
    return mix(b, r, a);
  }
  // one constant-pixel-width contour line at a given frequency
  float contourLine(float v, float freq){
    float coord = v * freq;
    float dco = max(fwidth(coord), 1e-5);
    float dist = abs(fract(coord) - 0.5) / dco;
    return 1.0 - clamp(dist - uLineWidth * 8.0, 0.0, 1.0);
  }
  #define TAU 6.2831853
  varying vec3 vWorldNormal;
  varying vec3 vWorldPos;
  varying float vValley;
  varying float vY;
  varying float vRel;
  uniform float uDuoHeightLocal;
  void main() {
    vec3 N = normalize(vWorldNormal);
    float elev = clamp((vY - uMinY) / max(0.001, (uMaxY - uMinY)), 0.0, 1.0);
    float hsrc = (uDuoHeightLocal > 0.5) ? vRel : elev; // local-per-dune vs world height

    // duotone: warm where the dune face turns toward the light azimuth, cool away.
    // a soft, wide blend band lets red and blue merge through purple like the ref.
    float src;
    if (uDuoMode == 2) {
      src = hsrc;                                          // by height (local or world)
    } else if (uDuoMode == 1) {
      src = duoNoise(vWorldPos * uDuoNoiseScale);          // by noise
    } else {
      vec3 nH = normalize(vec3(N.x, 0.0, N.z) + 1e-4);     // by face direction
      src = dot(nH, normalize(uLightDir)) * 0.5 + 0.5;
    }
    src = mix(src, hsrc, uDuoHeight);                      // optional height influence
    float flat_ = smoothstep(0.55, 1.0, N.y);
    float ft = clamp(src + (flat_ - 0.5) * 0.10 + uBalance, 0.0, 1.0);
    float t = smoothstep(uBlendLo, uBlendHi, ft);
    vec3 base = mix(uCool, uWarm, t);
    base *= mix(0.5, 1.18, elev); // lower areas darker, crests brighter

    // directional sun shading on the dune material (before emissive elements)
    if (uSunEnable > 0.5) {
      float sh = (uShadowEnable > 0.5) ? shadowFactor(vWorldPos, normalize(uSunDir)) : 1.0;
      float ndl = max(dot(N, uSunDir), 0.0) * sh;
      base = base * (uAmbient + (1.0 - uAmbient) * ndl * uSunIntensity)
             + uSunColor * (ndl * ndl) * uSunIntensity * 0.18;
      // extra darkening of cast/self shadows for contrast (below ambient)
      float occ = clamp((1.0 - sh) / max(0.001, uShadowStrength), 0.0, 1.0);
      base *= mix(1.0, uShadowDarken, occ);
    }

    // trail geometry along the winding centreline (computed first so the
    // topographic striations can be masked out wherever the trail sits)
    float u = (vWorldPos.z + uLen * 0.5) / uLen;
    float wf = 1.0 + (uWindGrowth - 1.0) * pow(clamp(u, 0.0, 1.0), uWindGrowthCurve);
    float cx = uWindAmp * wf * sin(u * TAU * uWindFreq + uWindPhase);
    if (uPeakSkirt != 0.0) {
      float spread = max(0.01, (uPeakRadius / uLen) * 1.1);
      cx += uPeakSkirt * uWidth * 0.3 * exp(-pow((u - uPeakPos) / spread, 2.0));
    }
    cx = clamp(cx, -uWidth * 0.47, uWidth * 0.47);
    float sx = vWorldPos.x - cx;      // signed lateral distance from the centreline
    float pd = abs(sx);
    float env = exp(-pd / max(0.05, uTrailSpill));       // bundle concentration
    // clear-zone mask uses a wider falloff so striations stop a bit beyond the glow
    float maskEnv = exp(-pd / max(0.05, uTrailSpill * uTrailClear));
    float trailMask = clamp(maskEnv * 1.5, 0.0, 1.0);    // 1 over the trail, 0 away

    // topographic striations following the relief — faded out over the trail
    // so the elevation lines never cross the glowing path
    // what the striation lines follow
    float lc;
    if (uLineMap == 1) lc = (vWorldPos.z + uLen * 0.5) / uLen;          // lengthwise (across the run)
    else if (uLineMap == 2) lc = (vWorldPos.x + uWidth * 0.5) / uWidth; // across (parallel to the run)
    else if (uLineMap == 3) lc = abs(sx) / max(1.0, uWidth * 0.5);      // bands following the path
    else if (uLineMap == 4) lc = length(vWorldPos.xz) / max(1.0, uLen); // radial from origin
    else if (uLineMap == 5) lc = atan(vWorldPos.x, vWorldPos.z) / 6.2831853 + 0.5; // angular
    else if (uLineMap == 6) {                                           // flow (streamline-like)
      vec2 fp = vWorldPos.xz * uLineFlowScale;
      vec2 fw = vec2(fbm3(vec3(fp, 3.1)), fbm3(vec3(fp + 7.7, 3.1)));
      fp += (fw - 0.5) * uLineFlowWarp;
      lc = fbm3(vec3(fp, 1.7));
    }
    else if (uLineMap == 7) lc = sx / max(1.0, uWidth);                 // parallel to the winding path
    else lc = elev;                                                     // height (topographic)
    // constant-width contour lines with mip-style LOD so they stay resolvable
    // (visible) into the distance instead of washing out to gray on the far peak
    float dens = fwidth(lc) * uLineFreq;                 // ~lines per pixel at base freq
    float lod = max(0.0, log2(dens / uLineFar));         // 0 near, grows with distance
    float f0 = uLineFreq / exp2(floor(lod));
    float line = mix(contourLine(lc, f0), contourLine(lc, f0 * 0.5), fract(lod));
    float la = line * uLineIntensity * (1.0 - trailMask);
    // line colour: local red/blue, shifting to the trail colour near the path
    vec3 lineCol = uLineColor;
    if (uLineFromSurface > 0.5) {
      lineCol = base * uLineBoost;
      lineCol = mix(lineCol, uPath, clamp(env * uLineTrailMix, 0.0, 1.0));
    }
    // emissive boost only on the red (warm) striations — t is 0 (blue) .. 1 (red)
    lineCol *= 1.0 + uLineEmissive * t;
    // light catch: striations on faces turned toward the sun illuminate (sheen)
    if (uLineLight > 0.0) {
      float lineLit = max(dot(N, normalize(uSunDir)), 0.0);
      lineCol *= 1.0 + uLineLight * pow(lineLit, uLineLightPow);
    }
    base = blendMode(base, lineCol, la, uLineBlend);

    // fresnel rim light on grazing edges (bright dune silhouettes)
    vec3 V = normalize(cameraPosition - vWorldPos);
    float fres = pow(1.0 - clamp(dot(N, V), 0.0, 1.0), uRimPower);
    float ra = clamp(fres * uRimIntensity, 0.0, 1.0);
    base = blendMode(base, uRimColor, ra, uRimBlend);

    // glowing trail
    float up = clamp(N.y, 0.0, 1.0);
    // edge gap shrinks toward the back so the two rails merge to one line on the mountain
    float gapE = uTrailGap * max(0.0, 1.0 - uTrailShrink * pow(clamp(u, 0.0, 1.0), uTrailShrinkCurve));
    if (uTrailStyle > 0.5) {
      // colour fill between the two rails
      if (uTrailMidStr > 0.0) {
        float mid = 1.0 - smoothstep(max(0.0, gapE - uTrailWidth), gapE, pd);
        base = mix(base, uTrailMid, mid * uTrailMidStr);
      }
      // two guiding edge lines at ±gap from the centre, dark in the middle
      float dL = abs(pd - gapE);
      float edge = smoothstep(uTrailWidth, 0.0, dL);
      base += uPath * edge * uTrailGlow * 2.0 * (0.45 + 0.55 * up);
    } else {
      // a bundle of parallel light lines, densest at the centre
      float lp = abs(fract(sx / max(0.2, uTrailSpacing) + 0.5) - 0.5) * 2.0;
      float lines = smoothstep(uTrailLineWidth, 0.0, lp) * env;
      float core = smoothstep(uTrailWidth, 0.0, pd);     // bright central streak
      base += uPath * (lines * 1.6 + core * 1.4) * uTrailGlow * (0.45 + 0.55 * up);
    }

    // little animated dot-lights travelling along the trail
    if (uTrailDotsOn > 0.5) {
      float center = smoothstep(gapE * 1.3 + uTrailWidth, 0.0, pd); // confine to the trail band
      float along = (vWorldPos.z + uLen * 0.5) / uLen;
      float ph = along * uTrailDotCount - uTime * uTrailDotSpeed;
      float seg = abs(fract(ph) - 0.5) * 2.0;
      float dot = smoothstep(0.12, 0.0, seg);
      base += uPath * dot * center * uTrailDotInt;
    }

    // animated flow fog: luminous wisps drifting along the path
    if (uFlowFog > 0.5) {
      float lat = sx;                                            // lateral from the path centre
      float w = fbm3(vec3(lat * uFlowDensity, vWorldPos.z * uFlowScale - uTime * uFlowSpeed, 4.0));
      float wisp = smoothstep(0.42, 0.82, w);                   // soft wispy mask
      float reach = exp(-abs(lat) / max(1.0, uFlowReach));      // concentrate near the trail
      base += uFlowColor * wisp * reach * uFlowIntensity;
    }

    // valley fog: mist pooling in the local low troughs (keeps the trail clear)
    if (uValleyFog > 0.0) {
      float vf = (1.0 - smoothstep(uValleyBottom, uValleyTop, vRel)) * (1.0 - trailMask);
      base = mix(base, uValleyColor, vf * uValleyFog);
    }

    // distance haze toward the horizon, thinned above a height (peak above the fog)
    float d = length(vWorldPos - cameraPosition);
    float f = clamp((d - uFogNear) / max(1.0, (uFogFar - uFogNear)), 0.0, 1.0);
    if (uFogHeightFade > 0.5) {
      f *= 1.0 - smoothstep(uFogHeight, uFogHeight + uFogHeightBand, vWorldPos.y);
    }
    base = mix(base, uHaze, f * 0.9);

    gl_FragColor = vec4(base, 1.0);
  }
`;

// runner marker (the object that travels the path in your game)

/* ------------------------------------------------------------------ */
/*  Traveler character + collectible spheres (from martell-traveler)   */
/* ------------------------------------------------------------------ */
const TRAVELER_FRAG = /* glsl */`
  uniform vec3 uColor; uniform float uIntensity; uniform float uTime; uniform float uSeed;
  varying vec2 vUv;
  void main(){
    float v = vUv.x;
    float fadeRaw = 1.0 - v / 0.85;
    float fade = fadeRaw > 0.0 ? pow(fadeRaw, 1.3) : 0.0;
    float flick = 0.8 + 0.2 * sin(uTime * 3.0 + uSeed * 12.566);
    gl_FragColor = vec4(uColor * uIntensity * flick, fade);
  }`;
const TRAVELER_VERT = /* glsl */`varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
const TRAVELER_UP = new THREE.Vector3(0, 1, 0);

class Traveler {
  constructor(scn, opts = {}) {
    this.head = new THREE.Vector3();
    this.maxHistory = 260;
    this.history = [];
    for (let i = 0; i < this.maxHistory; i++) this.history.push(this.head.clone());
    this.group = new THREE.Group();
    scn.add(this.group);
    this.colorVec = new THREE.Color(opts.color ?? 0xffe6a6);
    this.intensity = 1.0; this.ampMul = 1.0; this.waveSpeedMul = 1.0; this.phaseMul = 1.0;
    this.radius = (opts.thickness ?? 3) * 0.5;
    this.pulses = []; this.pulseAmp = 4.0; this.pulseDur = 1.0; this.pulseWidth = 0.15; this.growDur = 0.6;
    this.segments = 90; this.spacing = 1.1; this.tubeMax = Math.floor(this.segments * 0.85);
    this.maxFilaments = 5;
    this.activeFilaments = Math.min(this.maxFilaments, opts.filamentCount ?? 1);
    this.filaments = [];
    for (let i = 0; i < this.maxFilaments; i++) this.filaments.push(this._makeFilament(i));
    this._applyVisibility();
    this._t = new THREE.Vector3(); this._n = new THREE.Vector3(); this._b = new THREE.Vector3(); this._p = new THREE.Vector3();
  }
  _makeFilament(i) {
    const material = new THREE.ShaderMaterial({
      uniforms: { uColor: { value: this.colorVec }, uIntensity: { value: this.intensity }, uTime: { value: 0 }, uSeed: { value: i / this.maxFilaments } },
      vertexShader: TRAVELER_VERT, fragmentShader: TRAVELER_FRAG,
      transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
    });
    const mesh = new THREE.Mesh(new THREE.BufferGeometry(), material);
    mesh.frustumCulled = false;
    this.group.add(mesh);
    return { mesh, material, pts: [], grow: 1, angle: (i / this.maxFilaments) * Math.PI * 2,
      freq: 0.09 + i * 0.025, speed: 1.2 + i * 0.35, phase: i * 2.3, amp: 1.0 + (i % 3) * 0.45, twist: 0.5 + i * 0.22 };
  }
  resetHistory(point) { this.head.copy(point); this.history.length = 0; for (let k = 0; k < this.maxHistory; k++) this.history.push(point.clone()); this.pulses.length = 0; }
  triggerPulse() { this.pulses.push({ age: 0 }); }
  setFilamentCount(n) { const c = THREE.MathUtils.clamp(Math.round(n), 1, this.maxFilaments); if (c !== this.activeFilaments) { this.activeFilaments = c; this._applyVisibility(); } return this.activeFilaments; }
  _applyVisibility() { this.filaments.forEach((f, i) => { const on = i < this.activeFilaments; if (on && !f.mesh.visible) f.grow = 0; f.mesh.visible = on; }); }
  setColor(hex) { this.colorVec.set(hex); }
  setIntensity(v) { this.intensity = v; }
  setThickness(v) { this.radius = v * 0.5; }
  setHead(pos) { this.head.copy(pos); }
  update(dt, time, buildGeometry = true) {
    for (const pl of this.pulses) pl.age += dt;
    this.pulses = this.pulses.filter((pl) => pl.age < this.pulseDur);
    this.history.unshift(this.head.clone());
    if (this.history.length > this.maxHistory) this.history.pop();
    if (!buildGeometry) return;
    const hist = this.history, tubeMax = this.tubeMax;
    for (let fi = 0; fi < this.activeFilaments; fi++) {
      const f = this.filaments[fi];
      f.grow = Math.min(1, f.grow + dt / Math.max(0.05, this.growDur));
      f.material.uniforms.uTime.value = time;
      f.material.uniforms.uIntensity.value = this.intensity;
      const pts = f.pts; pts.length = 0;
      const jEnd = Math.floor(tubeMax * f.grow);
      for (let j = 0; j <= jEnd; j += 1) {
        const hi = Math.min(hist.length - 1, Math.floor(j * this.spacing));
        const sample = hist[hi];
        const a = hist[Math.max(0, hi - 1)], c = hist[Math.min(hist.length - 1, hi + 1)];
        this._t.subVectors(a, c); if (this._t.lengthSq() < 1e-6) this._t.set(0, 0, 1); this._t.normalize();
        this._n.crossVectors(this._t, TRAVELER_UP); if (this._n.lengthSq() < 1e-6) this._n.set(1, 0, 0); this._n.normalize();
        this._b.crossVectors(this._t, this._n).normalize();
        const u = j / (this.segments - 1);
        const env = Math.sin(u * Math.PI) * (0.4 + 0.6 * (1 - u));
        const wave = Math.sin(j * f.freq + f.phase * this.phaseMul + time * f.speed * this.waveSpeedMul);
        const ang = f.angle + u * f.twist * 6.0 + time * 0.3;
        let radius = f.amp * env * (0.6 + 0.4 * wave) * this.ampMul;
        for (const pl of this.pulses) {
          const front = pl.age / this.pulseDur, d = u - front;
          const g = Math.exp(-(d * d) / (2 * this.pulseWidth * this.pulseWidth));
          radius += g * (1 - pl.age / this.pulseDur) * this.pulseAmp * env * this.ampMul;
        }
        this._p.copy(sample).addScaledVector(this._n, Math.cos(ang) * radius).addScaledVector(this._b, Math.sin(ang) * radius);
        const lastP = pts.length ? pts[pts.length - 1] : null;
        if (!lastP || this._p.distanceToSquared(lastP) > 1e-4) pts.push(this._p.clone());
      }
      if (pts.length >= 3) {
        const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.5);
        const tube = new THREE.TubeGeometry(curve, Math.max(12, pts.length), this.radius, 8, false);
        f.mesh.geometry.dispose(); f.mesh.geometry = tube;
      }
    }
  }
}

const traveler = new Traveler(scene, { color: params.charColor, thickness: params.charThick, filamentCount: 1 });
traveler.group.visible = false;
const sphereGroup = new THREE.Group();
scene.add(sphereGroup);
let spheres = [], collectableCount = 0, collectedCount = 0;
const _side = new THREE.Vector3(), _spp = new THREE.Vector3();

function applyCharacter() {
  traveler.setColor(params.charColor);
  traveler.ampMul = params.charAmp;
  traveler.waveSpeedMul = params.charWaveSpeed;
  traveler.phaseMul = params.charPhase;
  traveler.pulseAmp = params.charPulseAmp;
  traveler.pulseDur = params.charPulseDur;
  traveler.pulseWidth = params.charPulseWidth;
  traveler.growDur = params.charGrowDur;
}

function buildSpheres() {
  for (const s of spheres) { sphereGroup.remove(s.mesh); s.mesh.geometry.dispose(); s.mesh.material.dispose(); }
  spheres = [];
  if (!flowCurve) return;
  const n = Math.max(0, Math.round(params.sphCount));
  for (let i = 0; i < n; i++) {
    const t = (i + 0.5) / n;
    const p = flowCurve.getPointAt(t);
    const base = p.clone(); base.y += params.charFloat; // all on the head's trajectory
    const mat = new THREE.MeshBasicMaterial({ color: new THREE.Color(params.sphColor), transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false });
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 14), mat);
    mesh.position.copy(base);
    sphereGroup.add(mesh);
    spheres.push({ mesh, base, phase: i * 1.7, collectable: true, collected: false, popT: 0, startY: base.y });
  }
  collectableCount = spheres.length;
  collectedCount = 0;
}

// warm the trail so it isn't a clump at spawn
function primeTraveler() {
  if (!flowCurve) return;
  const sp0 = flowCurve.getPointAt(0); sp0.y += params.charFloat;
  traveler.resetHistory(sp0);
  const dtSim = 1 / 60;
  let tt = 0;
  for (let s = 0; s < traveler.maxHistory; s++) {
    tt = Math.min(0.999, tt + (params.flySpeed * dtSim) / Math.max(1, curveLen));
    const p = flowCurve.getPointAt(tt); p.y += params.charFloat;
    traveler.setHead(p); traveler.update(dtSim, 0, false);
  }
}

function onPathRebuilt() { applyCharacter(); buildSpheres(); primeTraveler(); }

function updateSpheres(dt, time) {
  const ba = params.sphBreathAmp, bs = params.sphBreathSpeed;
  const PICK_H = params.sphSize * 1.6, PICK_V = params.charFloat * 0.5 + params.sphSize * 2;
  collectedCount = 0;
  for (const s of spheres) {
    if (s.collected) {
      s.popT = Math.min(1, s.popT + dt * 2);
      const e = 1 - Math.pow(1 - s.popT, 3);
      s.mesh.scale.setScalar(Math.max(0, params.sphSize * (1 - e)));
      s.mesh.position.set(s.base.x, s.startY + e * params.sphSize * 2, s.base.z);
      if (s.popT >= 1) s.mesh.visible = false;
      collectedCount++;
      continue;
    }
    s.mesh.scale.setScalar(params.sphSize * (1 + ba * Math.sin(time * bs + s.phase)));
    s.mesh.position.set(s.base.x, s.base.y + params.sphFloatAmp * Math.sin(time * params.sphFloatSpeed + s.phase), s.base.z);
    const dx = traveler.head.x - s.mesh.position.x, dz = traveler.head.z - s.mesh.position.z, dy = traveler.head.y - s.mesh.position.y;
    if (Math.hypot(dx, dz) < PICK_H && Math.abs(dy) < PICK_V) {
      s.collected = true; s.popT = 0; s.startY = s.mesh.position.y;
      traveler.triggerPulse();
    }
  }
}
function resetSpheresLap() { for (const s of spheres) { s.collected = false; s.popT = 0; s.mesh.visible = true; } collectedCount = 0; }

function buildTerrain() {
  const t0 = performance.now();
  const { width, length, segmentsX, segmentsZ } = params;
  const nx = segmentsX + 1, nz = segmentsZ + 1;
  const positions = new Float32Array(nx * nz * 3);
  const colors = new Float32Array(nx * nz * 3);
  const uvs = new Float32Array(nx * nz * 2); // planar UVs over the footprint
  const valleys = new Float32Array(nx * nz);  // 0 on path .. 1 far (for the shader)
  const heights = new Float32Array(nx * nz);  // world Y per vertex (shadow heightmap)
  const rels = new Float32Array(nx * nz);     // local relative height (0 floor .. 1 peak)

  const totalLen = length + params.backExtend; // includes the back extension
  const col = new THREE.Color();
  let k = 0, t = 0, vi = 0;
  for (let j = 0; j < nz; j++) {
    const z = -length / 2 + (j / segmentsZ) * totalLen;
    for (let i = 0; i < nx; i++) {
      const x = -width / 2 + (i / segmentsX) * width;
      const { y, valley, relHeight } = sample(x, z);
      positions[k] = x; positions[k + 1] = y; positions[k + 2] = z;

      // color: blend a glowing floor color near the path into the height ramp
      const hRatio = THREE.MathUtils.clamp((y - params.floorHeight) / (params.mountainHeight || 1), 0, 1);
      rampColor(hRatio, col);
      const onPath = 1 - valley; // 1 on path
      col.lerp(floorColor, onPath * 0.85);
      colors[k] = col.r; colors[k + 1] = col.g; colors[k + 2] = col.b;
      uvs[t] = i / segmentsX; uvs[t + 1] = j / segmentsZ;
      valleys[vi] = valley; heights[vi] = y; rels[vi] = relHeight; vi++;
      k += 3; t += 2;
    }
  }

  // indices
  const index = new Uint32Array(segmentsX * segmentsZ * 6);
  let p = 0;
  for (let j = 0; j < segmentsZ; j++) {
    for (let i = 0; i < segmentsX; i++) {
      const a = j * nx + i;
      const b = a + 1;
      const c = a + nx;
      const d = c + 1;
      index[p++] = a; index[p++] = c; index[p++] = b;
      index[p++] = b; index[p++] = c; index[p++] = d;
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  geo.setAttribute('aValley', new THREE.BufferAttribute(valleys, 1));
  geo.setAttribute('aRelHeight', new THREE.BufferAttribute(rels, 1));
  geo.setIndex(new THREE.BufferAttribute(index, 1));
  geo.computeVertexNormals();
  geo.computeBoundingBox();

  const mat = makeTerrainMaterial(geo);

  // bake the height field to a texture for in-shader self-shadowing
  if (heightTex) heightTex.dispose();
  heightTex = new THREE.DataTexture(heights, nx, nz, THREE.RedFormat, THREE.FloatType);
  heightTex.magFilter = THREE.NearestFilter;
  heightTex.minFilter = THREE.NearestFilter;
  heightTex.needsUpdate = true;
  if (mat.isShaderMaterial) {
    mat.uniforms.uHeightMap.value = heightTex;
    mat.uniforms.uWidth.value = width;
    mat.uniforms.uLen.value = length;
  }

  if (terrain) { terrain.geometry.dispose(); terrain.material.dispose(); scene.remove(terrain); }
  terrain = new THREE.Mesh(geo, mat);
  terrain.name = 'Terrain';
  scene.add(terrain);
  if (typeof updateSun === 'function') updateSun();

  buildPathLine();
  buildFlowLines();

  // path curve for the camera / runner
  flowCurve = new THREE.CatmullRomCurve3(getCenterlinePoints(200));
  curveLen = flowCurve.getLength();
  if (typeof onPathRebuilt === 'function') onPathRebuilt(); // rebuild spheres + warm the character

  const ms = (performance.now() - t0).toFixed(0);
  const secs = (curveLen / params.flySpeed).toFixed(1);
  setStatus(`${nx * nz} verts · ${segmentsX * segmentsZ * 2} tris · path ${curveLen | 0} m ≈ ${secs}s @ speed ${params.flySpeed} · ${ms} ms`);
}

function getCenterlinePoints(n = 400) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const z = -params.length / 2 + (i / n) * params.length;
    const x = pathCenterX(z);
    const y = floorYAt(z) + peakAt(x, z) + 0.6; // climb the mountain too
    pts.push(new THREE.Vector3(x, y, z));
  }
  return pts;
}

function buildPathLine() {
  if (pathLine) { pathLine.geometry.dispose(); pathLine.material.dispose(); scene.remove(pathLine); pathLine = null; }
  if (!params.showPath) return;
  const pts = getCenterlinePoints(400);
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  const m = new THREE.LineBasicMaterial({ color: 0xffd089 });
  pathLine = new THREE.Line(g, m);
  pathLine.name = 'PathCenterline';
  scene.add(pathLine);
}

function lineMaterial() {
  return new THREE.LineBasicMaterial({
    vertexColors: true,
    transparent: true,
    opacity: params.lineOpacity,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
}

// add a polyline (array of {x,y,z}) with a single colour to the flow group
function addPolyline(group, pts, color, name) {
  const n = pts.length;
  if (n < 2) return;
  const pos = new Float32Array(n * 3);
  const col = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    pos[i * 3] = pts[i].x; pos[i * 3 + 1] = pts[i].y; pos[i * 3 + 2] = pts[i].z;
    col[i * 3] = color.r; col[i * 3 + 1] = color.g; col[i * 3 + 2] = color.b;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const line = new THREE.Line(g, lineMaterial());
  if (name) line.name = name;
  group.add(line);
}

// Dispatcher: build either path-parallel flow lines or topographic contours.
function buildFlowLines() {
  if (flowGroup) {
    flowGroup.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
    scene.remove(flowGroup);
    flowGroup = null;
  }
  if (!params.flowLines) return;

  flowGroup = new THREE.Group();
  flowGroup.name = 'FlowLines';
  if (params.lineMode === 'contour') buildContourLines(flowGroup);
  else buildPathLines(flowGroup);
  scene.add(flowGroup);
}

// MODE 1 — lines parallel to the path, draped over the hills (the original).
function buildPathLines(group) {
  if (params.lineCount < 2) return;
  const warm = new THREE.Color(params.lineWarm);
  const cool = new THREE.Color(params.lineCool);
  const halfW = params.width / 2;
  const nz = Math.max(60, params.segmentsZ);
  const c = new THREE.Color();

  for (let li = 0; li < params.lineCount; li++) {
    const f = params.lineCount === 1 ? 0 : (li / (params.lineCount - 1)) * 2 - 1; // -1..1
    const s = f * halfW;
    const lateral = Math.abs(f);

    const pos = new Float32Array((nz + 1) * 3);
    const col = new Float32Array((nz + 1) * 3);
    let k = 0;
    for (let j = 0; j <= nz; j++) {
      const z = -params.length / 2 + (j / nz) * params.length;
      const cx = pathCenterX(z);
      const x = THREE.MathUtils.clamp(cx + s, -halfW, halfW);
      const r = sample(x, z);
      pos[k] = x; pos[k + 1] = r.y + params.lineLift; pos[k + 2] = z;
      c.copy(warm).lerp(cool, lateral);
      const bright = (1 - r.valley) * 0.9 + (1 - lateral) * 0.3 + 0.15;
      c.multiplyScalar(Math.min(1.6, bright));
      col[k] = c.r; col[k + 1] = c.g; col[k + 2] = c.b;
      k += 3;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    group.add(new THREE.Line(g, lineMaterial()));
  }
}

// MODE 2 — topographic contour lines (iso-elevation) via marching squares.
function buildContourLines(group) {
  const W = params.width, L = params.length;
  const halfW = W / 2, halfL = L / 2;
  const gx = Math.max(8, Math.round(params.contourGridX));   // cells across width
  const cell = W / gx;
  const gz = Math.max(8, Math.round(L / cell));              // cells along length
  const nx = gx + 1, nz = gz + 1;

  // sample the height field once
  const H = new Float32Array(nx * nz);
  const xs = new Float32Array(nx), zs = new Float32Array(nz);
  for (let i = 0; i < nx; i++) xs[i] = -halfW + (i / gx) * W;
  for (let j = 0; j < nz; j++) zs[j] = -halfL + (j / gz) * L;
  let hMin = Infinity, hMax = -Infinity;
  for (let j = 0; j < nz; j++) {
    for (let i = 0; i < nx; i++) {
      const y = sample(xs[i], zs[j]).y;
      H[j * nx + i] = y;
      if (y < hMin) hMin = y;
      if (y > hMax) hMax = y;
    }
  }
  if (hMax - hMin < 1e-4) return;

  const warm = new THREE.Color(params.lineWarm);
  const cool = new THREE.Color(params.lineCool);
  const N = Math.max(1, Math.round(params.contourLevels));

  for (let l = 0; l < N; l++) {
    const t = (l + 1) / (N + 1);
    const level = hMin + (hMax - hMin) * t;

    // collect marching-squares segments for this level
    const segs = [];
    for (let j = 0; j < gz; j++) {
      for (let i = 0; i < gx; i++) {
        const a = H[j * nx + i];           // bottom-left
        const b = H[j * nx + i + 1];        // bottom-right
        const cc = H[(j + 1) * nx + i + 1]; // top-right
        const d = H[(j + 1) * nx + i];      // top-left
        let idx = 0;
        if (a > level) idx |= 1;
        if (b > level) idx |= 2;
        if (cc > level) idx |= 4;
        if (d > level) idx |= 8;
        if (idx === 0 || idx === 15) continue;

        const x0 = xs[i], x1 = xs[i + 1], z0 = zs[j], z1 = zs[j + 1];
        const lerp = (va, vb) => (level - va) / (vb - va);
        const eB = () => ({ x: x0 + (x1 - x0) * lerp(a, b), z: z0 });          // bottom
        const eR = () => ({ x: x1, z: z0 + (z1 - z0) * lerp(b, cc) });         // right
        const eT = () => ({ x: x0 + (x1 - x0) * lerp(d, cc), z: z1 });         // top
        const eL = () => ({ x: x0, z: z0 + (z1 - z0) * lerp(a, d) });          // left
        const push = (p, q) => segs.push([p.x, p.z, q.x, q.z]);

        switch (idx) {
          case 1: case 14: push(eL(), eB()); break;
          case 2: case 13: push(eB(), eR()); break;
          case 3: case 12: push(eL(), eR()); break;
          case 4: case 11: push(eR(), eT()); break;
          case 6: case 9:  push(eB(), eT()); break;
          case 7: case 8:  push(eL(), eT()); break;
          case 5:  push(eL(), eT()); push(eB(), eR()); break; // saddle
          case 10: push(eL(), eB()); push(eR(), eT()); break; // saddle
        }
      }
    }
    if (!segs.length) continue;

    // colour by elevation: warm (low/valley) -> cool (high)
    const c = warm.clone().lerp(cool, t);
    c.multiplyScalar(1.1);
    const y = level + params.lineLift;

    // stitch segments into connected polylines so they export cleanly
    const polylines = stitchSegments(segs);
    for (const pl of polylines) {
      const pts = pl.map(p => ({ x: p[0], y, z: p[1] }));
      addPolyline(group, pts, c, 'Contour_' + String(l).padStart(2, '0'));
    }
  }
}

// Link marching-squares segments sharing endpoints into polylines.
function stitchSegments(segs) {
  const key = (x, z) => x.toFixed(3) + ',' + z.toFixed(3);
  const ends = new Map(); // endpoint key -> list of {seg, end}
  const used = new Array(segs.length).fill(false);
  const add = (k, seg, end) => { (ends.get(k) || ends.set(k, []).get(k)).push({ seg, end }); };
  for (let s = 0; s < segs.length; s++) {
    add(key(segs[s][0], segs[s][1]), s, 0);
    add(key(segs[s][2], segs[s][3]), s, 1);
  }
  const ptAt = (s, end) => end === 0 ? [segs[s][0], segs[s][1]] : [segs[s][2], segs[s][3]];
  const nextFrom = (k, skip) => {
    const list = ends.get(k);
    if (!list) return -1;
    for (const e of list) if (e.seg !== skip && !used[e.seg]) return e.seg;
    return -1;
  };

  const polylines = [];
  for (let s = 0; s < segs.length; s++) {
    if (used[s]) continue;
    used[s] = true;
    let line = [ptAt(s, 0), ptAt(s, 1)];
    // extend forward from the tail
    let cur = s, tail = ptAt(s, 1);
    while (true) {
      const nx = nextFrom(key(tail[0], tail[1]), cur);
      if (nx < 0) break;
      used[nx] = true;
      const a = ptAt(nx, 0), b = ptAt(nx, 1);
      tail = (key(a[0], a[1]) === key(tail[0], tail[1])) ? b : a;
      line.push(tail);
      cur = nx;
    }
    // extend backward from the head
    cur = s; let head = ptAt(s, 0);
    while (true) {
      const nx = nextFrom(key(head[0], head[1]), cur);
      if (nx < 0) break;
      used[nx] = true;
      const a = ptAt(nx, 0), b = ptAt(nx, 1);
      head = (key(a[0], a[1]) === key(head[0], head[1])) ? b : a;
      line.unshift(head);
      cur = nx;
    }
    polylines.push(line);
  }
  return polylines;
}

function updateLineOpacity() {
  if (!flowGroup) return;
  flowGroup.traverse(o => { if (o.material) o.material.opacity = params.lineOpacity; });
}

function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportGLB() {
  if (!terrain) return;
  setStatus('exporting GLB…');
  const group = new THREE.Group();
  const mesh = new THREE.Mesh(terrain.geometry, standardMaterial());
  mesh.name = 'Terrain';
  group.add(mesh);
  if (params.showPath && pathLine) group.add(pathLine.clone());
  if (params.includeLinesInExport && flowGroup) group.add(flowGroup.clone());
  new GLTFExporter().parse(group, (res) => {
    download(new Blob([res], { type: 'model/gltf-binary' }), 'valley_terrain.glb');
    setStatus('saved valley_terrain.glb');
  }, (err) => { console.error(err); setStatus('GLB export failed (see console)'); },
  { binary: true, onlyVisible: true });
}

// ---- bake the flow lines into a top-down texture (PNG) --------------------
// Maps the terrain footprint (X,Z) to the image, matching the mesh's planar
// UVs, so the PNG drops straight onto the terrain as a separate line layer.
function bakeLinesTexture() {
  const W = params.width, L = params.length;
  // width = across the path (must resolve every line), height = along the path
  const cw = Math.min(8192, Math.max(64, Math.round(params.texWidth)));
  const ch = Math.min(16384, Math.max(64, Math.round(params.texHeight)));

  const canvas = document.createElement('canvas');
  canvas.width = cw; canvas.height = ch;
  const ctx = canvas.getContext('2d');

  if (params.texMono) { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cw, ch); }
  else if (!params.texTransparent) { ctx.fillStyle = params.texBackground; ctx.fillRect(0, 0, cw, ch); }
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  // scale line width to the across-path resolution so it reads consistently
  const wScale = cw / 2048;

  // world (x,z) -> canvas px. Flip toggles align with the target app's UV origin.
  const px = (x) => { const u = (x + W / 2) / W; return (params.texFlipU ? 1 - u : u) * cw; };
  const py = (z) => { const v = (z + L / 2) / L; return (params.texFlipV ? v : 1 - v) * ch; };

  const strokePolyline = (pos, hexColor, widthMul) => {
    ctx.beginPath();
    ctx.moveTo(px(pos.getX(0)), py(pos.getZ(0)));
    for (let i = 1; i < pos.count; i++) ctx.lineTo(px(pos.getX(i)), py(pos.getZ(i)));
    ctx.strokeStyle = hexColor;
    ctx.lineWidth = params.texLineWidth * wScale * widthMul;
    if (params.texGlow > 0) {
      ctx.shadowColor = hexColor;
      ctx.shadowBlur = params.texGlow * wScale;
      ctx.stroke();           // glow pass
      ctx.shadowBlur = 0;
    }
    ctx.stroke();             // crisp core
  };

  const tmp = new THREE.Color();
  const hexOf = (col, idx) => {
    tmp.setRGB(col.getX(idx), col.getY(idx), col.getZ(idx));
    return '#' + tmp.getHexString();
  };

  if (flowGroup) {
    flowGroup.children.forEach((ln) => {
      const pos = ln.geometry.getAttribute('position');
      const col = ln.geometry.getAttribute('color');
      const c = params.texMono ? '#000000' : hexOf(col, (pos.count / 2) | 0); // mid-line colour
      strokePolyline(pos, c, 1);
    });
  }
  if (params.texIncludeCenterline) {
    const pts = getCenterlinePoints(500);
    const fake = { count: pts.length, getX: (i) => pts[i].x, getZ: (i) => pts[i].z };
    strokePolyline(fake, params.texMono ? '#000000' : params.lineWarm, 1.8);
  }

  canvas.toBlob((b) => {
    download(b, 'valley_lines.png');
    setStatus(`saved valley_lines.png — ${cw}x${ch}px line texture`);
  }, 'image/png');
}

// ---- Cinema 4D: native spline objects via a Script-Manager .py ------------
function vecListToPy(pts) {
  let s = '[';
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    s += '[' + p.x.toFixed(2) + ',' + p.y.toFixed(2) + ',' + p.z.toFixed(2) + ']';
    if (i < pts.length - 1) s += ',';
  }
  return s + ']';
}

function exportC4DSplines() {
  const entries = [];
  entries.push(['PathCenterline', getCenterlinePoints(500)]);
  if (flowGroup) {
    flowGroup.children.forEach((ln, i) => {
      const pos = ln.geometry.getAttribute('position');
      const n = pos.count;
      const step = Math.max(1, Math.floor(n / 250)); // cap ~250 pts/spline
      const pts = [];
      for (let j = 0; j < n; j += step) pts.push({ x: pos.getX(j), y: pos.getY(j), z: pos.getZ(j) });
      if ((n - 1) % step !== 0) pts.push({ x: pos.getX(n - 1), y: pos.getY(n - 1), z: pos.getZ(n - 1) });
      entries.push(['FlowLine_' + String(i).padStart(3, '0'), pts]);
    });
  }

  let py = '';
  py += '# Cinema 4D spline importer - generated by Valley Terrain Generator\n';
  py += '# In C4D: Extensions > Script Manager > paste this file > Execute.\n';
  py += '# Creates native SplineObjects under a "ValleySplines" null.\n';
  py += 'import c4d\nfrom c4d import Vector\n\n';
  py += 'FLIP_Z = True   # C4D is left-handed; this matches the default GLB terrain import. Set False if mirrored.\n';
  py += 'SCALE  = 100.0  # C4D imports GLB in cm (meters x100), so splines need x100 to match. Use 1.0 if your terrain is at raw scale.\n\n';
  py += 'SPLINES = [\n';
  for (const [name, pts] of entries) py += '    (' + JSON.stringify(name) + ', ' + vecListToPy(pts) + '),\n';
  py += ']\n\n';
  py += [
    'def build(name, pts):',
    '    sp = c4d.SplineObject(len(pts), c4d.SPLINETYPE_LINEAR)',
    '    sp.SetName(name)',
    '    for i, p in enumerate(pts):',
    '        z = -p[2] if FLIP_Z else p[2]',
    '        sp.SetPoint(i, Vector(p[0] * SCALE, p[1] * SCALE, z * SCALE))',
    '    sp.Message(c4d.MSG_UPDATE)',
    '    return sp',
    '',
    'def main():',
    '    doc = c4d.documents.GetActiveDocument()',
    '    doc.StartUndo()',
    '    grp = c4d.BaseObject(c4d.Onull)',
    '    grp.SetName("ValleySplines")',
    '    doc.InsertObject(grp)',
    '    doc.AddUndo(c4d.UNDOTYPE_NEWOBJ, grp)',
    '    for name, pts in SPLINES:',
    '        sp = build(name, pts)',
    '        sp.InsertUnder(grp)',
    '        doc.AddUndo(c4d.UNDOTYPE_NEWOBJ, sp)',
    '    doc.EndUndo()',
    '    c4d.EventAdd()',
    '',
    "if __name__ == '__main__':",
    '    main()',
    '',
  ].join('\n');

  download(new Blob([py], { type: 'text/x-python' }), 'valley_splines_c4d.py');
  setStatus(`saved valley_splines_c4d.py — ${entries.length} native C4D splines`);
}

// camera lens: focal length (mm, full-frame) -> vertical FOV
function updateLens() {
  camera.fov = 2 * Math.atan(12 / params.focalLength) * 180 / Math.PI; // 24mm sensor height
  camera.updateProjectionMatrix();
}

// aspect-ratio frame overlay (letterbox/pillarbox bars)
const FRAME_RATIOS = { off: 0, '16:9': 16 / 9, '9:16': 9 / 16, '2.39:1': 2.39, '2:1': 2, '1:1': 1, '4:5': 0.8, '3:2': 1.5, '4:3': 4 / 3 };
const mkBar = (extra) => { const d = document.createElement('div'); d.style.cssText = 'position:fixed;background:#000;pointer-events:none;z-index:6;display:none;' + extra; document.body.appendChild(d); return d; };
const frameTop = mkBar('top:0;left:0;width:100%;');
const frameBottom = mkBar('bottom:0;left:0;width:100%;');
const frameLeft = mkBar('top:0;left:0;height:100%;');
const frameRight = mkBar('top:0;right:0;height:100%;');
const frameBars = [frameTop, frameBottom, frameLeft, frameRight];
function updateFrame() {
  const r = FRAME_RATIOS[params.frameRatio] || 0;
  if (!r) { frameBars.forEach(b => (b.style.display = 'none')); return; }
  const W = innerWidth, H = innerHeight;
  let top = 0, side = 0;
  if (r > W / H) top = (H - W / r) / 2; else side = (W - H * r) / 2;
  frameBars.forEach(b => { b.style.display = 'block'; b.style.opacity = params.frameOpacity; });
  frameTop.style.height = top + 'px'; frameBottom.style.height = top + 'px';
  frameLeft.style.width = side + 'px'; frameRight.style.width = side + 'px';
}

// ---- linked folder on disk (File System Access API, Chromium only) --------
// Works the same on the live GitHub Pages site — files live on YOUR disk.
let dirHandle = null;
function idbReq(fn) {
  return new Promise((res, rej) => {
    const o = indexedDB.open('tg-fs', 1);
    o.onupgradeneeded = () => o.result.createObjectStore('h');
    o.onsuccess = () => { try { fn(o.result, res, rej); } catch (e) { rej(e); } };
    o.onerror = () => rej(o.error);
  });
}
const idbSet = (k, v) => idbReq((db, res, rej) => { const tx = db.transaction('h', 'readwrite'); tx.objectStore('h').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); });
const idbGet = (k) => idbReq((db, res, rej) => { const r = db.transaction('h', 'readonly').objectStore('h').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });

async function fsPerm(handle, request, mode = 'readwrite') {
  if (!handle) return false;
  const opts = { mode };
  if ((await handle.queryPermission(opts)) === 'granted') return true;
  if (request && (await handle.requestPermission(opts)) === 'granted') return true;
  return false;
}
async function linkFolder() {
  if (!window.showDirectoryPicker) { setStatus('not supported here — use Chrome/Edge'); return; }
  try {
    dirHandle = await window.showDirectoryPicker({ id: 'tg-presets', mode: 'readwrite' });
    await idbSet('dir', dirHandle);
    await refreshFolderDropdown(true);
    setStatus('linked folder "' + dirHandle.name + '"');
  } catch (e) { /* user cancelled */ }
}
async function restoreFolder() {
  try { const h = await idbGet('dir'); if (h) { dirHandle = h; await refreshFolderDropdown(false); } } catch (e) { /* ignore */ }
}
async function listFolderPresets(request) {
  if (!dirHandle || !(await fsPerm(dirHandle, request, 'read'))) return null;
  const names = [];
  for await (const [name, entry] of dirHandle.entries()) {
    if (entry.kind === 'file' && name.endsWith('.json')) names.push(name.replace(/\.json$/, ''));
  }
  return names.sort();
}
async function saveFolderPreset() {
  if (!dirHandle) { setStatus('link a folder first'); return; }
  const name = (ui.folderName || '').trim();
  if (!name) { setStatus('enter a name first'); return; }
  if (!(await fsPerm(dirHandle, true))) { setStatus('permission denied'); return; }
  const fh = await dirHandle.getFileHandle(name + '.json', { create: true });
  const w = await fh.createWritable(); await w.write(JSON.stringify(params, null, 2)); await w.close();
  ui.folderName = '';
  gui.controllersRecursive().forEach(c => c.updateDisplay());
  await refreshFolderDropdown(false);
  setStatus('saved "' + name + '.json" to folder');
}
async function loadFolderPreset(name) {
  if (!dirHandle || !(await fsPerm(dirHandle, true, 'read'))) return;
  const fh = await dirHandle.getFileHandle(name + '.json');
  const txt = await (await fh.getFile()).text();
  const n = applyLoadedParams(JSON.parse(txt));
  setStatus('loaded "' + name + '" (' + n + ' settings)');
}
async function deleteFolderPreset() {
  const name = ui.folderLoad;
  if (!dirHandle || !name || name === '(none)') return;
  if (!(await fsPerm(dirHandle, true))) return;
  await dirHandle.removeEntry(name + '.json');
  await refreshFolderDropdown(false);
  setStatus('deleted "' + name + '.json"');
}
async function refreshFolderDropdown(request) {
  const names = await listFolderPresets(request);
  if (folderLoadCtrl) folderLoadCtrl.destroy();
  let opts;
  if (names === null) opts = dirHandle ? ['(reconnect ↻)'] : ['(no folder linked)'];
  else opts = names.length ? names : ['(empty)'];
  folderLoadCtrl = fFolder.add(ui, 'folderLoad', opts).name('load from folder')
    .onChange(v => { if (v && !v.startsWith('(')) loadFolderPreset(v); });
}

// shared apply: merge params, refresh GUI, and re-run the whole pipeline
function applyLoadedParams(loaded) {
  let n = 0;
  for (const k in loaded) { if (k in params) { params[k] = loaded[k]; n++; } }
  gui.controllersRecursive().forEach(c => c.updateDisplay());
  noise = new SimplexNoise(params.seed);
  buildTerrain();
  applyToneMapping(); updatePost(); updateGrade(); updateFog(); updateSky(); updateSun(); updateLens(); updateFrame();
  refreshViewDropdown();
  controls.enabled = !params.flyMode;
  runT = 0;
  return n;
}

// reference image overlay (compare the render against a reference live)

document.body.appendChild(refInput);
function applyRef() {
  refImg.style.display = (refState.show && refImg.getAttribute('src')) ? 'block' : 'none';
  refImg.style.opacity = refState.opacity;
  refImg.style.objectFit = refState.fit;
}
function saveRefState() {
  try { localStorage.setItem('tg.ref', JSON.stringify({ opacity: refState.opacity, fit: refState.fit, img: refImg.getAttribute('src') || '' })); } catch (e) {}
}
refInput.addEventListener('change', (e) => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { refImg.src = r.result; refState.show = true; applyRef(); saveRefState(); gui.controllersRecursive().forEach((c) => c.updateDisplay()); setStatus('reference image loaded'); };
  r.readAsDataURL(f); refInput.value = '';
});
try { const st = JSON.parse(localStorage.getItem('tg.ref') || 'null'); if (st) { refState.opacity = st.opacity ?? 0.5; refState.fit = st.fit || 'contain'; if (st.img) refImg.src = st.img; } } catch (e) {}
if (!refImg.getAttribute('src')) refImg.src = './reference.jpg'; // committed default reference

buildTerrain();

const hud = document.getElementById('hud');
const pad = (n) => String(n).padStart(2, '0');

const fpsEl = document.createElement('div');
fpsEl.style.cssText = 'position:fixed;top:10px;left:12px;z-index:10;color:#9bffc4;font:12px ui-monospace,SFMono-Regular,monospace;background:rgba(10,12,20,.5);padding:3px 8px;border-radius:6px;pointer-events:none;';
document.body.appendChild(fpsEl);
let fpsAccum = 0, fpsFrames = 0;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloomPass.setSize(innerWidth, innerHeight);
  updateFrame();
});

const clock = new THREE.Clock();
const _p = new THREE.Vector3();
const _a = new THREE.Vector3();
const _tan = new THREE.Vector3();
let flyTime = 0;

renderer.setAnimationLoop(() => {
  const dt = Math.min(0.05, clock.getDelta());

  fpsEl.style.display = params.showFps ? 'block' : 'none';
  if (params.showFps) {
    fpsAccum += dt; fpsFrames++;
    if (fpsAccum >= 0.5) { fpsEl.textContent = (fpsFrames / fpsAccum).toFixed(0) + ' fps'; fpsAccum = 0; fpsFrames = 0; }
  }

  skyDome.position.copy(camera.position);
  skyMat.uniforms.uTime.value += dt;
  { // aim the background glow at the mountain summit
    const L = params.length;
    const cz = Math.min(L * 0.5, -L * 0.5 + params.peakPos * L);
    const sx = pathCenterX(cz, false);
    const sy = floorYAt(cz) + (params.peakEnable ? params.peakHeight : 0);
    skyMat.uniforms.uBgGlowDir.value.set(sx, sy, cz).sub(camera.position).normalize();
  }
  if (terrain && terrain.material.isShaderMaterial) terrain.material.uniforms.uTime.value += dt;
  if (params.grain > 0) gradePass.uniforms.uTime.value = (gradePass.uniforms.uTime.value + dt) % 100;

  if (flowCurve && (params.showRunner || params.flyMode || params.character)) {
    const prev = runT;
    runT = (runT + (params.flySpeed * dt) / curveLen) % 1;
    if (runT < prev) { flyTime = 0; if (params.character) resetSpheresLap(); } // wrapped → new lap
    flowCurve.getPointAt(runT, _p);
    runner.position.copy(_p);
  }
  runner.visible = params.showRunner && !params.character;

  // traveler character: head rides the path, filament wake trails behind
  traveler.group.visible = params.character;
  sphereGroup.visible = params.character;
  if (params.character && flowCurve) {
    const ctime = clock.elapsedTime;
    flowCurve.getPointAt(runT, _p);
    _p.y += params.charFloat + Math.sin(ctime * 1.8) * params.charBob;
    _p.x += Math.sin(ctime * 0.9) * params.charSway;
    traveler.setHead(_p);
    traveler.update(dt, ctime);
    updateSpheres(dt, ctime);
    const frac = collectableCount ? Math.min(1, collectedCount / collectableCount) : 0;
    traveler.setFilamentCount(1 + Math.floor(frac * 5));
    traveler.setThickness(params.charThick + (params.charThickMax - params.charThick) * frac);
    traveler.setIntensity(params.charIntensity);
  }

  if (params.flyMode && flowCurve) {
    flyTime += dt;
    flowCurve.getPointAt(runT, _p);
    flowCurve.getPointAt(Math.min(0.999, runT + params.flyLookAhead / curveLen), _a);
    if (params.character) {
      // third-person: sit just behind the character, looking ahead
      flowCurve.getTangentAt(runT, _tan);
      camera.position.set(_p.x - _tan.x * params.flyBehind, _p.y + params.charFloat + params.flyHeight, _p.z - _tan.z * params.flyBehind);
      camera.lookAt(_a.x, _a.y + params.charFloat, _a.z);
    } else {
      camera.position.set(_p.x, _p.y + params.flyHeight, _p.z);
      camera.lookAt(_a.x, _a.y + params.flyHeight * 0.5, _a.z);
    }
    hud.style.display = 'block';
    const dist = Math.round(runT * curveLen);
    hud.innerHTML = `DISTANCE <b>${dist} M</b> &nbsp;·&nbsp; TIME <b>${pad((flyTime / 60) | 0)}:${pad((flyTime % 60) | 0)}</b> &nbsp;·&nbsp; SPEED <b>${params.flySpeed}</b>`;
  } else {
    hud.style.display = 'none';
    controls.update();
  }

  if (params.post) composer.render();
  else renderer.render(scene, camera);
});

// hide the control panel by default; toggle with the S key
gui.hide();
let guiVisible = false;
addEventListener('keydown', (e) => {
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return; // don't steal typing
  const k = e.key && e.key.toLowerCase();
  if (k === 's') { guiVisible = !guiVisible; guiVisible ? gui.show() : gui.hide(); }
  if (k === 'r') { refState.show = !refState.show; applyRef(); gui.controllersRecursive().forEach((c) => c.updateDisplay()); }
});

// bottom-left quick buttons: cycle saved cameras, toggle runner/fly mode
const btnCam = document.getElementById('btnCam');
const btnRun = document.getElementById('btnRun');
let camIndex = -1;
btnCam.addEventListener('click', () => {
  const names = Object.keys(params.cameraBookmarks);
  if (!names.length) { setStatus('no saved camera views'); return; }
  camIndex = (camIndex + 1) % names.length;
  goView(names[camIndex]);
  setStatus('view: ' + names[camIndex]);
});
function syncRunBtn() { btnRun.classList.toggle('on', !!params.flyMode); }
btnRun.addEventListener('click', () => {
  params.flyMode = !params.flyMode;
  controls.enabled = !params.flyMode;
  if (!params.flyMode) controls.target.set(0, 20, 0);
  gui.controllersRecursive().forEach((c) => c.updateDisplay());
  syncRunBtn();
});
syncRunBtn();

// Load the committed default parameters (parameters.json) and apply them as the
// startup defaults. Works on the live site too; the baked-in defaults are the
// fallback when the file isn't reachable (e.g. opened via file://).
fetch('./parameters.json')
  .then((r) => (r.ok ? r.json() : null))
  .then((d) => {
    if (!d) return;
    applyLoadedParams(d);
    if (params.defaultView && params.cameraBookmarks[params.defaultView]) {
      goView(params.defaultView);
      camIndex = Object.keys(params.cameraBookmarks).indexOf(params.defaultView);
    }
    syncRunBtn();
    setStatus('loaded parameters.json defaults');
  })
  .catch(() => {});
