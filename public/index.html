}
// CPU mirror of the shader's striation field (uLineMap) so flow lines can trace the SELECTED striation.
// Returns f(x,z), or null to fall back to the surface height (height / flow modes).
function striationFieldFn() {
  const map = STRIATION_MAPS[params.shLineMap] || 0;
  const L = params.length, W = params.width;
  if (map === 1) return (x, z) => (z + L / 2) / L;                                   // lengthwise
  if (map === 2) return (x, z) => (x + W / 2) / W;                                   // across
  if (map === 3) return (x, z) => Math.abs(x - pathCenterX(z)) / Math.max(1, W / 2); // from path
  if (map === 4) return (x, z) => Math.hypot(x, z) / Math.max(1, L);                 // radial
  if (map === 5) return (x, z) => Math.atan2(x, z) / 6.2831853 + 0.5;                // angular
  if (map === 7) return (x, z) => (x - pathCenterX(z)) / Math.max(1, W);             // path-parallel
  return null; // height (0) and flow (6 — fbm too costly on CPU) → use the surface height field
}
// marching-squares iso-segments of a scalar field F on a grid
function marchingSquares(F, nx, gx, gz, xs, zs, level) {
  const segs = [];
  for (let j = 0; j < gz; j++) for (let i = 0; i < gx; i++) {
    const a = F[j * nx + i], b = F[j * nx + i + 1], cc = F[(j + 1) * nx + i + 1], d = F[(j + 1) * nx + i];
    let idx = 0; if (a > level) idx |= 1; if (b > level) idx |= 2; if (cc > level) idx |= 4; if (d > level) idx |= 8;
    if (idx === 0 || idx === 15) continue;
    const x0 = xs[i], x1 = xs[i + 1], z0 = zs[j], z1 = zs[j + 1];
    const lp = (va, vb) => (level - va) / (vb - va);
    const eB = () => ({ x: x0 + (x1 - x0) * lp(a, b), z: z0 }), eR = () => ({ x: x1, z: z0 + (z1 - z0) * lp(b, cc) });
    const eT = () => ({ x: x0 + (x1 - x0) * lp(d, cc), z: z1 }), eL = () => ({ x: x0, z: z0 + (z1 - z0) * lp(a, d) });
    const push = (p, q) => segs.push([p.x, p.z, q.x, q.z]);
    switch (idx) {
      case 1: case 14: push(eL(), eB()); break; case 2: case 13: push(eB(), eR()); break;
      case 3: case 12: push(eL(), eR()); break; case 4: case 11: push(eR(), eT()); break;
      case 6: case 9: push(eB(), eT()); break; case 7: case 8: push(eL(), eT()); break;
      case 5: push(eL(), eT()); push(eB(), eR()); break; case 10: push(eL(), eB()); push(eR(), eT()); break;
    }
  }
  return segs;
}
// add a polyline (array of {x,y,z}) to the flow group with per-vertex brightness (scalar or array)
function addPolyline(group, pts, bright, name) {
  const n = pts.length;
  if (n < 2) return;
  const pos = new Float32Array(n * 3), dist = new Float32Array(n), br = new Float32Array(n), mask = new Float32Array(n);
  let total = 0;
  for (let i = 0; i < n; i++) {
    if (i > 0) total += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y, pts[i].z - pts[i - 1].z);
    pos[i * 3] = pts[i].x; pos[i * 3 + 1] = pts[i].y; pos[i * 3 + 2] = pts[i].z;
    dist[i] = total; // absolute arc-length → consistent pulse spacing across lines of any length
    br[i] = Array.isArray(bright) ? bright[i] : (bright != null ? bright : 1);
    mask[i] = lineMaskAt(pts[i].x, pts[i].z);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aDist', new THREE.BufferAttribute(dist, 1));
  g.setAttribute('aBright', new THREE.BufferAttribute(br, 1));
  g.setAttribute('aMask', new THREE.BufferAttribute(mask, 1));
  const line = new THREE.Line(g, getFlowLineMat());
  if (name) line.name = name;
  group.add(line);
}

// Dispatcher: build either path-parallel flow lines or topographic contours.
function buildFlowLines() {
  if (flowGroup) {
    flowGroup.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
    scene.remove(flowGroup);
    flowGroup = null;
  }
  if (!params.flowLines) return;

  flowGroup = new THREE.Group();
  flowGroup.name = 'FlowLines';
  if (params.lineMode === 'contour') buildContourLines(flowGroup);
  else if (params.lineMode === 'striations') buildStriationLines(flowGroup);
  else buildPathLines(flowGroup);
  scene.add(flowGroup);
}

// MODE 1 — lines parallel to the path, draped over the hills (the original).
function buildPathLines(group) {
  if (params.lineCount < 2) return;
  const halfW = params.width / 2;
  const nz = Math.max(8, Math.round(params.lineDetail)); // points per line → topography fidelity
  for (let li = 0; li < params.lineCount; li++) {
    const f = params.lineCount === 1 ? 0 : (li / (params.lineCount - 1)) * 2 - 1; // -1..1
    const s = f * halfW, lateral = Math.abs(f);
    const pts = [], bright = [];
    for (let j = 0; j <= nz; j++) {
      const z = -params.length / 2 + (j / nz) * params.length;
      const x = THREE.MathUtils.clamp(pathCenterX(z) + s, -halfW, halfW);
      const r = sample(x, z);
      pts.push({ x, y: r.y + params.lineLift, z });
      bright.push(Math.min(1.5, (1 - r.valley) * 0.9 + (1 - lateral) * 0.3 + 0.2));
    }
    addPolyline(group, pts, bright, 'PathLine_' + li);
  }
}
// MODE 3 — trace the SELECTED surface striation (params.shLineMap) as glowing flow lines
function buildStriationLines(group) {
  const W = params.width, L = params.length, halfW = W / 2, halfL = L / 2;
  const gx = Math.max(8, Math.round(params.contourGridX)), cell = W / gx, gz = Math.max(8, Math.round(L / cell));
  const nx = gx + 1, nz = gz + 1;
  const xs = new Float32Array(nx), zs = new Float32Array(nz);
  for (let i = 0; i < nx; i++) xs[i] = -halfW + (i / gx) * W;
  for (let j = 0; j < nz; j++) zs[j] = -halfL + (j / gz) * L;
  const H = new Float32Array(nx * nz), F = new Float32Array(nx * nz);
  const fieldFn = striationFieldFn();
  let fMin = Infinity, fMax = -Infinity;
  for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) {
    const x = xs[i], z = zs[j], y = sample(x, z).y; H[j * nx + i] = y;
    const v = fieldFn ? fieldFn(x, z) : y; F[j * nx + i] = v;
    if (v < fMin) fMin = v; if (v > fMax) fMax = v;
  }
  if (fMax - fMin < 1e-5) return;
  const hAt = (x, z) => { // bilinear surface height for smooth draping
    let fi = Math.max(0, Math.min(gx - 1e-3, (x + halfW) / W * gx)), fj = Math.max(0, Math.min(gz - 1e-3, (z + halfL) / L * gz));
    const i0 = Math.floor(fi), j0 = Math.floor(fj), tx = fi - i0, tz = fj - j0;
    const h0 = H[j0 * nx + i0] * (1 - tx) + H[j0 * nx + i0 + 1] * tx;
    const h1 = H[(j0 + 1) * nx + i0] * (1 - tx) + H[(j0 + 1) * nx + i0 + 1] * tx;
    return h0 * (1 - tz) + h1 * tz;
  };
  const N = Math.max(1, Math.round(params.contourLevels));
  for (let l = 0; l < N; l++) {
    const t = (l + 1) / (N + 1), level = fMin + (fMax - fMin) * t;
    const segs = marchingSquares(F, nx, gx, gz, xs, zs, level);
    if (!segs.length) continue;
    for (const pl of stitchSegments(segs)) {
      const pts = pl.map(p => ({ x: p[0], y: hAt(p[0], p[1]) + params.lineLift, z: p[1] }));
      addPolyline(group, pts, 1.0, 'Striation_' + l);
    }
  }
}

// MODE 2 — topographic contour lines (iso-elevation) via marching squares.
function buildContourLines(group) {
  const W = params.width, L = params.length;
  const halfW = W / 2, halfL = L / 2;
  const gx = Math.max(8, Math.round(params.contourGridX));   // cells across width
  const cell = W / gx;
  const gz = Math.max(8, Math.round(L / cell));              // cells along length
  const nx = gx + 1, nz = gz + 1;

  // sample the height field once
  const H = new Float32Array(nx * nz);
  const xs = new Float32Array(nx), zs = new Float32Array(nz);
  for (let i = 0; i < nx; i++) xs[i] = -halfW + (i / gx) * W;
  for (let j = 0; j < nz; j++) zs[j] = -halfL + (j / gz) * L;
  let hMin = Infinity, hMax = -Infinity;
  for (let j = 0; j < nz; j++) {
    for (let i = 0; i < nx; i++) {
      const y = sample(xs[i], zs[j]).y;
      H[j * nx + i] = y;
      if (y < hMin) hMin = y;
      if (y > hMax) hMax = y;
    }
  }
  if (hMax - hMin < 1e-4) return;

  const warm = new THREE.Color(params.lineWarm);
  const cool = new THREE.Color(params.lineCool);
  const N = Math.max(1, Math.round(params.contourLevels));

  for (let l = 0; l < N; l++) {
    const t = (l + 1) / (N + 1);
    const level = hMin + (hMax - hMin) * t;

    // collect marching-squares segments for this level
    const segs = [];
    for (let j = 0; j < gz; j++) {
      for (let i = 0; i < gx; i++) {
        const a = H[j * nx + i];           // bottom-left
        const b = H[j * nx + i + 1];        // bottom-right
        const cc = H[(j + 1) * nx + i + 1]; // top-right
        const d = H[(j + 1) * nx + i];      // top-left
        let idx = 0;
        if (a > level) idx |= 1;
        if (b > level) idx |= 2;
        if (cc > level) idx |= 4;
        if (d > level) idx |= 8;
        if (idx === 0 || idx === 15) continue;

        const x0 = xs[i], x1 = xs[i + 1], z0 = zs[j], z1 = zs[j + 1];
        const lerp = (va, vb) => (level - va) / (vb - va);
        const eB = () => ({ x: x0 + (x1 - x0) * lerp(a, b), z: z0 });          // bottom
        const eR = () => ({ x: x1, z: z0 + (z1 - z0) * lerp(b, cc) });         // right
        const eT = () => ({ x: x0 + (x1 - x0) * lerp(d, cc), z: z1 });         // top
        const eL = () => ({ x: x0, z: z0 + (z1 - z0) * lerp(a, d) });          // left
        const push = (p, q) => segs.push([p.x, p.z, q.x, q.z]);

        switch (idx) {
          case 1: case 14: push(eL(), eB()); break;
          case 2: case 13: push(eB(), eR()); break;
          case 3: case 12: push(eL(), eR()); break;
          case 4: case 11: push(eR(), eT()); break;
          case 6: case 9:  push(eB(), eT()); break;
          case 7: case 8:  push(eL(), eT()); break;
          case 5:  push(eL(), eT()); push(eB(), eR()); break; // saddle
          case 10: push(eL(), eB()); push(eR(), eT()); break; // saddle
        }
      }
    }
    if (!segs.length) continue;

    const y = level + params.lineLift;
    // stitch segments into connected polylines so they export cleanly
    const polylines = stitchSegments(segs);
    for (const pl of polylines) {
      const pts = pl.map(p => ({ x: p[0], y, z: p[1] }));
      addPolyline(group, pts, 0.7 + 0.5 * (1 - t), 'Contour_' + String(l).padStart(2, '0')); // brighter in the valleys
    }
  }
}

// Link marching-squares segments sharing endpoints into polylines.
function stitchSegments(segs) {
  const key = (x, z) => x.toFixed(3) + ',' + z.toFixed(3);
  const ends = new Map(); // endpoint key -> list of {seg, end}
  const used = new Array(segs.length).fill(false);
  const add = (k, seg, end) => { (ends.get(k) || ends.set(k, []).get(k)).push({ seg, end }); };
  for (let s = 0; s < segs.length; s++) {
    add(key(segs[s][0], segs[s][1]), s, 0);
    add(key(segs[s][2], segs[s][3]), s, 1);
  }
  const ptAt = (s, end) => end === 0 ? [segs[s][0], segs[s][1]] : [segs[s][2], segs[s][3]];
  const nextFrom = (k, skip) => {
    const list = ends.get(k);
    if (!list) return -1;
    for (const e of list) if (e.seg !== skip && !used[e.seg]) return e.seg;
    return -1;
  };

  const polylines = [];
  for (let s = 0; s < segs.length; s++) {
    if (used[s]) continue;
    used[s] = true;
    let line = [ptAt(s, 0), ptAt(s, 1)];
    // extend forward from the tail
    let cur = s, tail = ptAt(s, 1);
    while (true) {
      const nx = nextFrom(key(tail[0], tail[1]), cur);
      if (nx < 0) break;
      used[nx] = true;
      const a = ptAt(nx, 0), b = ptAt(nx, 1);
      tail = (key(a[0], a[1]) === key(tail[0], tail[1])) ? b : a;
      line.push(tail);
      cur = nx;
    }
    // extend backward from the head
    cur = s; let head = ptAt(s, 0);
    while (true) {
      const nx = nextFrom(key(head[0], head[1]), cur);
      if (nx < 0) break;
      used[nx] = true;
      const a = ptAt(nx, 0), b = ptAt(nx, 1);
      head = (key(a[0], a[1]) === key(head[0], head[1])) ? b : a;
      line.unshift(head);
      cur = nx;
    }
    polylines.push(line);
  }
  return polylines;
}

function updateLineOpacity() { updateFlowLineMat(); /* opacity + gold/anim uniforms live on the shared material */ }

/* ------------------------------------------------------------------ */
/*  Export                                                             */
/* ------------------------------------------------------------------ */
function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportGLB() {
  if (!terrain) return;
  setStatus('exporting GLB…');
  const group = new THREE.Group();
  const mesh = new THREE.Mesh(terrain.geometry, standardMaterial());
  mesh.name = 'Terrain';
  group.add(mesh);
  if (params.showPath && pathLine) group.add(pathLine.clone());
  if (params.includeLinesInExport && flowGroup) group.add(flowGroup.clone());
  new GLTFExporter().parse(group, (res) => {
    download(new Blob([res], { type: 'model/gltf-binary' }), 'valley_terrain.glb');
    setStatus('saved valley_terrain.glb');
  }, (err) => { console.error(err); setStatus('GLB export failed (see console)'); },
  { binary: true, onlyVisible: true });
}

function exportOBJ() {
  if (!terrain) return;
  setStatus('exporting OBJ…');
  const mesh = new THREE.Mesh(terrain.geometry, terrain.material);
  mesh.name = 'Terrain';
  const text = new OBJExporter().parse(mesh);
  download(new Blob([text], { type: 'text/plain' }), 'valley_terrain.obj');
  setStatus('saved valley_terrain.obj (vertex colors are GLB-only)');
}

// ---- splines: centerline + flow lines as OBJ polylines (no faces) --------
function exportSplinesOBJ() {
  const group = new THREE.Group();
  const cl = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(getCenterlinePoints(500)),
    new THREE.LineBasicMaterial()
  );
  cl.name = 'PathCenterline';
  group.add(cl);
  if (flowGroup) {
    flowGroup.children.forEach((ln, i) => {
      const c = new THREE.Line(ln.geometry.clone(), new THREE.LineBasicMaterial());
      c.name = 'FlowLine_' + String(i).padStart(3, '0');
      group.add(c);
    });
  }
  const text = new OBJExporter().parse(group);
  download(new Blob([text], { type: 'text/plain' }), 'valley_splines.obj');
  setStatus(`saved valley_splines.obj — ${group.children.length} polyline curves`);
}

// ---- bake the flow lines into a top-down texture (PNG) --------------------
// Maps the terrain footprint (X,Z) to the image, matching the mesh's planar
// UVs, so the PNG drops straight onto the terrain as a separate line layer.
function bakeLinesTexture() {
  const W = params.width, L = params.length;
  // width = across the path (must resolve every line), height = along the path
  const cw = Math.min(8192, Math.max(64, Math.round(params.texWidth)));
  const ch = Math.min(16384, Math.max(64, Math.round(params.texHeight)));

  const canvas = document.createElement('canvas');
  canvas.width = cw; canvas.height = ch;
  const ctx = canvas.getContext('2d');

  if (params.texMono) { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cw, ch); }
  else if (!params.texTransparent) { ctx.fillStyle = params.texBackground; ctx.fillRect(0, 0, cw, ch); }
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  // scale line width to the across-path resolution so it reads consistently
  const wScale = cw / 2048;

  // world (x,z) -> canvas px. Flip toggles align with the target app's UV origin.
  const px = (x) => { const u = (x + W / 2) / W; return (params.texFlipU ? 1 - u : u) * cw; };
  const py = (z) => { const v = (z + L / 2) / L; return (params.texFlipV ? v : 1 - v) * ch; };

  const strokePolyline = (pos, hexColor, widthMul) => {
    ctx.beginPath();
    ctx.moveTo(px(pos.getX(0)), py(pos.getZ(0)));
    for (let i = 1; i < pos.count; i++) ctx.lineTo(px(pos.getX(i)), py(pos.getZ(i)));
    ctx.strokeStyle = hexColor;
    ctx.lineWidth = params.texLineWidth * wScale * widthMul;
    if (params.texGlow > 0) {
      ctx.shadowColor = hexColor;
      ctx.shadowBlur = params.texGlow * wScale;
      ctx.stroke();           // glow pass
      ctx.shadowBlur = 0;
    }
    ctx.stroke();             // crisp core
  };

  const tmp = new THREE.Color();
  const hexOf = (col, idx) => {
    tmp.setRGB(col.getX(idx), col.getY(idx), col.getZ(idx));
    return '#' + tmp.getHexString();
  };

  if (flowGroup) {
    flowGroup.children.forEach((ln) => {
      const pos = ln.geometry.getAttribute('position');
      const col = ln.geometry.getAttribute('color');
      const c = params.texMono ? '#000000' : hexOf(col, (pos.count / 2) | 0); // mid-line colour
      strokePolyline(pos, c, 1);
    });
  }
  if (params.texIncludeCenterline) {
    const pts = getCenterlinePoints(500);
    const fake = { count: pts.length, getX: (i) => pts[i].x, getZ: (i) => pts[i].z };
    strokePolyline(fake, params.texMono ? '#000000' : params.lineWarm, 1.8);
  }

  canvas.toBlob((b) => {
    download(b, 'valley_lines.png');
    setStatus(`saved valley_lines.png — ${cw}x${ch}px line texture`);
  }, 'image/png');
}

// ---- Cinema 4D: native spline objects via a Script-Manager .py ------------
function vecListToPy(pts) {
  let s = '[';
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    s += '[' + p.x.toFixed(2) + ',' + p.y.toFixed(2) + ',' + p.z.toFixed(2) + ']';
    if (i < pts.length - 1) s += ',';
  }
  return s + ']';
}

function exportC4DSplines() {
  const entries = [];
  entries.push(['PathCenterline', getCenterlinePoints(500)]);
  if (flowGroup) {
    flowGroup.children.forEach((ln, i) => {
      const pos = ln.geometry.getAttribute('position');
      const n = pos.count;

function framedRect() { // centred framed region in CSS px (same shape as the letterbox)

}
// ---- FPS: render ONLY the framed region (no wasted letterbox pixels) ----------------------------

function canFramedOnly() {

    camera.aspect = FRAME_RATIOS[params.frameRatio];
    setVignetteFrame(0, 0, 1, 1);                       // the framed buffer IS the frame
    frameBars.forEach(b => (b.style.display = 'none')); // the black-cleared outside is the letterbox
  } else {
    composer.setSize(innerWidth, innerHeight); bloomPass.setSize(innerWidth, innerHeight); afterimagePass.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight;

// ---- focus point: a visible target the camera locks onto in focus-lock mode ----
function commitFocus(p, auto) {

  // save into the selected keyframe so each keyframe can hold a different focus point
  const k = tl.selected >= 0 ? params.timeline.keys[tl.selected] : null;

}
function activeViewCamera() { return rigMode ? editCam : camera; }

  focusPicking = true;

  updateFocusMarker();

  setStatus('🎯 click on the terrain to set the focus point  ·  Esc to cancel');

function pickFocusAt(clientX, clientY) {
  const r = renderer.domElement.getBoundingClientRect();

    const fr = framedRect(), fx = (clientX - r.left) - fr.x, fy = (clientY - r.top) - fr.y;
    if (fx < 0 || fx > fr.w || fy < 0 || fy > fr.h) { setStatus('click inside the framed view'); endFocusPick(); return; }
    ndc = { x: (fx / fr.w) * 2 - 1, y: -((fy / fr.h) * 2 - 1) };
  } else ndc = { x: ((clientX - r.left) / r.width) * 2 - 1, y: -((clientY - r.top) / r.height) * 2 + 1 };
  _ray.setFromCamera(ndc, activeViewCamera());
  const hits = terrain ? _ray.intersectObject(terrain, false) : [];
  if (hits.length) { commitFocus(hits[0].point, true); setStatus('focus point set on the terrain'); }
  else setStatus('no surface there — aim at the dunes or mountain');
  endFocusPick();
}
function setFocusToSummit() {
  const L = params.length;
  const cz = Math.min(L * 0.5, -L * 0.5 + params.peakPos * L);
  const sx = pathCenterX(cz, false);
  const sy = floorYAt(cz) + (params.peakEnable ? params.peakHeight : 0);
  commitFocus(new THREE.Vector3(sx, sy, cz), true);
  setStatus('focus locked on the mountain summit');
}
function orientFocusMarker(cam) {
  if (!focusMarker.visible) return;
  focusMarker.position.copy(focusPointV3);
  // keep a small, constant on-screen size regardless of distance OR zoom (FOV / focal length)
  const d = cam.position.distanceTo(focusPointV3);
  const fov = (cam.fov || 50) * Math.PI / 180;
  focusMarker.scale.setScalar(Math.max(0.15, d * Math.tan(fov / 2) / 60)); // ~5% of viewport height
  focusMarker.userData.ring.lookAt(cam.position);
}

// ---- video export (framed WebM) ----
function startExport() {
  if (exporting) return;
  if (buildTimeline() < 2) { setStatus('need ≥2 keyframes to export'); return; }
  if (rigMode) setRigMode(false); // export records the shot camera's full-frame view, not the rig
  const ratio = FRAME_RATIOS[params.frameRatio] || (innerWidth / innerHeight);
  let h = Math.round(params.exportResHeight), w = Math.round(h * ratio);
  w -= w % 2; h -= h % 2;
  preExportSize = { w: innerWidth, h: innerHeight, aspect: camera.aspect, pr: renderer.getPixelRatio() };
  renderer.setPixelRatio(1);
  renderer.setSize(w, h, false);
  renderer.setScissorTest(false); renderer.setViewport(0, 0, w, h); // never inherit a framed-render scissor
  composer.setSize(w, h); bloomPass.setSize(w, h); afterimagePass.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  // Preferred: deterministic offline encode (smooth, exact length, independent of render speed).
  if (window.VideoEncoder) {
    setStatus('encoding offline…');
    exportOffline(w, h).then(ok => { if (!ok) startExportRealtime(w, h); });
    return;
  }
  startExportRealtime(w, h);
}
function startExportRealtime(w, h) {
  const canvas = renderer.domElement;
  const mimes = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  const mime = mimes.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
  if (!window.MediaRecorder) { setStatus('MediaRecorder not supported here (use Chrome)'); restoreExportSize(); return; }
  const stream = canvas.captureStream(params.exportFps);
  recordChunks = [];
  mediaRecorder = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 16e6 } : {});
  mediaRecorder.ondataavailable = e => { if (e.data && e.data.size) recordChunks.push(e.data); };
  mediaRecorder.onstop = downloadRecording;
  exporting = true;
  setVignetteFrame(0, 0, 1, 1); // buffer = frame
  mediaRecorder.start();
  setStatus('exporting… 0%  (' + w + '×' + h + ')');
  playTimeline(true);
}
function finishExport() { if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop(); }
function restoreExportSize() {
  if (!preExportSize) return;
  renderer.setPixelRatio(preExportSize.pr);
  renderer.setSize(preExportSize.w, preExportSize.h, false);
  renderer.setScissorTest(false); renderer.setViewport(0, 0, preExportSize.w, preExportSize.h);
  preExportSize = null;
  applyRenderRegion(); // re-size composer/camera/letterbox for the live mode (framed-only or full)
}
function downloadRecording() {
  const blob = new Blob(recordChunks, { type: 'video/webm' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'martell-' + Date.now() + '.webm';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  exporting = false; mediaRecorder = null; recordChunks = null;
  restoreExportSize(); // re-applies the framed/full render region (now that exporting is false)
  setStatus('export complete');
}

let modalResolve = null;
function closeModal(val) {
  const bd = document.getElementById('modalBackdrop');

// opts: { title, message?, input?:bool, value?, buttons:[{label,value,primary?,danger?}] } — value '__input__' returns the field text
function showModal(opts) {
  return new Promise((resolve) => {
    if (modalResolve) closeModal(null); // never stack
    modalResolve = resolve;
    const bd = document.getElementById('modalBackdrop');
    document.getElementById('modalTitle').textContent = opts.title || '';
    const inp = document.getElementById('modalInput'), msg = document.getElementById('modalMsg');
    inp.style.display = opts.input ? 'block' : 'none';
    msg.style.display = opts.message ? 'block' : 'none';
    msg.textContent = opts.message || '';
    if (opts.input) inp.value = opts.value || '';
    const btns = document.getElementById('modalBtns'); btns.innerHTML = '';
    for (const b of (opts.buttons || [{ label: 'OK', value: true, primary: true }])) {
      const el = document.createElement('button');
      el.textContent = b.label;
      if (b.primary) el.classList.add('primary');
      if (b.danger) el.classList.add('danger');
      el.addEventListener('click', () => {
        if (b.value === '__input__') { const v = inp.value.trim(); if (!v) { inp.focus(); return; } closeModal(v); }
        else closeModal(b.value);
      });
      btns.appendChild(el);
    }
    bd.classList.add('show'); bd.setAttribute('aria-hidden', 'false');
    if (opts.input) setTimeout(() => { inp.focus(); inp.select(); }, 30);
  });
}

const _fmtT = (s) => { s = Math.max(0, s | 0); return (s / 60 | 0) + ':' + String(s % 60).padStart(2, '0'); };

  loop.addEventListener('click', () => { params.timeline.loop = !params.timeline.loop; loop.classList.toggle('on', params.timeline.loop); viewerBarActivity(); });

  const seekTo = (e) => { const r = track.getBoundingClientRect(); const f = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); const [inT, outT] = tlRange(); scrubTimeline(inT + f * (outT - inT)); updateViewerBar(); };

      for (const ref of refs) { localStorage.setItem('tg.anim.' + ref, JSON.stringify(d.timeline)); if (!idx.includes(ref)) idx.push(ref); }
      localStorage.setItem('tg.anims', JSON.stringify(idx));
    } catch (_) {}
    setWorkspaceMode('ui');  // enterUIMode (uibar/inspector are hidden by body.present)
    uiSetPreview(true);      // interactive: the client can click through the prototype
  } else if (hasAnim) {
    loadAnimation(d.timeline);      // snaps to the first frame
    params.timeline.loop = true;    // loop for the client
    playTimeline(true);             // autoplay from the start
    controls.enabled = false;
    showViewerBar();                // play / pause / scrub controls for the client
  }
  // reveal only once the scene + the first animation frame are actually painted (kills the wrong-angle flash)
  requestAnimationFrame(() => requestAnimationFrame(hideViewerLoading));
}
async function cloudDeleteAnimByName(name) {
  const id = cloudAnimMap[name]; if (!id) return;
  const choice = await showModal({
    title: 'Delete animation',
    message: `Delete the cloud animation “${name}”? This can’t be undone.`,
    buttons: [{ label: 'Cancel', value: null }, { label: 'Delete', value: 'del', danger: true }],
  });
  if (choice !== 'del') return;
  if (await cloudApi.remove(id)) {
    if (currentAnimMeta.name === name) currentAnimMeta = { id: null, name: null };
    animPreviewCache.delete(id);
    setStatus(`deleted cloud animation "${name}"`); await cloudListAnims(); refreshAnimMenuIfOpen();
  } else setStatus('cloud delete failed');
}
async function cloudRenameAnim(oldName) {
  const oldId = cloudAnimMap[oldName]; if (!oldId) return;
  const newName = await showModal({
    title: 'Rename animation', input: true, value: oldName,
    buttons: [{ label: 'Cancel', value: null }, { label: 'Rename', value: '__input__', primary: true }],
  });
  if (!newName || newName === oldName) return;
  if (cloudAnimMap[newName]) { setStatus(`an animation named "${newName}" already exists`); return; }
  const row = await cloudApi.get(oldId); // D1 is upsert-by-name → rename = re-save under the new name, then drop the old
  if (!row || !row.data) { setStatus('could not load the animation to rename'); return; }
  if (!(await cloudApi.upsert({ kind: 'animation', name: newName, data: row.data }))) { setStatus('rename failed'); return; }
  await cloudApi.remove(oldId);
  if (currentAnimMeta.name === oldName) currentAnimMeta.name = newName;
  recentAnims = recentAnims.map(n => (n === oldName ? newName : n));
  await cloudListAnims();
  if (currentAnimMeta.name === newName) currentAnimMeta.id = cloudAnimMap[newName] || null;
  refreshAnimStrip();
  setStatus(`renamed to "${newName}"`);
}
async function loadAnimFromStrip(name) {
  const id = cloudAnimMap[name]; if (!id) return;
  if (tlIsDirty()) { // don't silently wipe unsaved edits when switching clips
    const choice = await showModal({
      title: 'Unsaved changes',
      message: `You have unsaved changes to “${currentAnimMeta.name || 'the current animation'}”. Load “${name}” anyway?`,
      buttons: [{ label: 'Cancel', value: null }, { label: 'Save first', value: 'save' }, { label: 'Discard & load', value: 'load', danger: true }],
    });
    if (choice === null) return;
    if (choice === 'save') { await saveCurrentAnimCloud(); if (tlIsDirty()) return; } // save cancelled → abort the switch
  }
  const row = await cloudApi.get(id);
  if (row && row.data) { loadAnimation(row.data); currentAnimMeta = { id, name }; noteRecentAnim(name); setStatus(`loaded cloud animation "${name}"`); refreshAnimStrip(); }
  else setStatus('could not load cloud animation');
}

// ---- linked folder on disk (File System Access API, Chromium only) --------
// Works the same on the live GitHub Pages site — files live on YOUR disk.
let dirHandle = null;
function idbReq(fn) {
  return new Promise((res, rej) => {
    const o = indexedDB.open('tg-fs', 1);
    o.onupgradeneeded = () => o.result.createObjectStore('h');
    o.onsuccess = () => { try { fn(o.result, res, rej); } catch (e) { rej(e); } };
    o.onerror = () => rej(o.error);
  });
}
const idbSet = (k, v) => idbReq((db, res, rej) => { const tx = db.transaction('h', 'readwrite'); tx.objectStore('h').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); });
const idbGet = (k) => idbReq((db, res, rej) => { const r = db.transaction('h', 'readonly').objectStore('h').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });

async function fsPerm(handle, request, mode = 'readwrite') {
  if (!handle) return false;
  const opts = { mode };
  if ((await handle.queryPermission(opts)) === 'granted') return true;
  if (request && (await handle.requestPermission(opts)) === 'granted') return true;
  return false;
}
async function linkFolder() {
  if (!window.showDirectoryPicker) { setStatus('not supported here — use Chrome/Edge'); return; }
  try {
    dirHandle = await window.showDirectoryPicker({ id: 'tg-presets', mode: 'readwrite' });
    await idbSet('dir', dirHandle);
    await refreshFolderDropdown(true);
    setStatus('linked folder "' + dirHandle.name + '"');
  } catch (e) { /* user cancelled */ }
}
async function restoreFolder() {
  try { const h = await idbGet('dir'); if (h) { dirHandle = h; await refreshFolderDropdown(false); } } catch (e) { /* ignore */ }
}
async function listFolderPresets(request) {
  if (!dirHandle || !(await fsPerm(dirHandle, request, 'read'))) return null;
  const names = [];
  for await (const [name, entry] of dirHandle.entries()) {
    if (entry.kind === 'file' && name.endsWith('.json')) names.push(name.replace(/\.json$/, ''));
  }
  return names.sort();
}
async function saveFolderPreset() {
  if (!dirHandle) { setStatus('link a folder first'); return; }
  const name = (ui.folderName || '').trim();
  if (!name) { setStatus('enter a name first'); return; }
  if (!(await fsPerm(dirHandle, true))) { setStatus('permission denied'); return; }
  const fh = await dirHandle.getFileHandle(name + '.json', { create: true });
  const w = await fh.createWritable(); await w.write(JSON.stringify(params, null, 2)); await w.close();
  ui.folderName = '';
  gui.controllersRecursive().forEach(c => c.updateDisplay());
  await refreshFolderDropdown(false);
  setStatus('saved "' + name + '.json" to folder');
}
async function loadFolderPreset(name) {
  if (!dirHandle || !(await fsPerm(dirHandle, true, 'read'))) return;
  const fh = await dirHandle.getFileHandle(name + '.json');
  const txt = await (await fh.getFile()).text();
  const n = applyLoadedParams(JSON.parse(txt));
  setStatus('loaded "' + name + '" (' + n + ' settings)');
}
async function deleteFolderPreset() {
  const name = ui.folderLoad;
  if (!dirHandle || !name || name === '(none)') return;
  if (!(await fsPerm(dirHandle, true))) return;
  await dirHandle.removeEntry(name + '.json');
  await refreshFolderDropdown(false);
  setStatus('deleted "' + name + '.json"');
}
async function refreshFolderDropdown(request) {
  const names = await listFolderPresets(request);
  if (folderLoadCtrl) folderLoadCtrl.destroy();
  let opts;
  if (names === null) opts = dirHandle ? ['(reconnect ↻)'] : ['(no folder linked)'];
  else opts = names.length ? names : ['(empty)'];
  folderLoadCtrl = fFolder.add(ui, 'folderLoad', opts).name('load from folder')
    .onChange(v => { if (v && !v.startsWith('(')) loadFolderPreset(v); });
}

// shared apply: merge params, refresh GUI, and re-run the whole pipeline
function applyLoadedParams(loaded) {
  let n = 0;
  for (const k in loaded) { if (k in params) { params[k] = loaded[k]; n++; } }
  gui.controllersRecursive().forEach(c => c.updateDisplay());
  noise = new SimplexNoise(params.seed);
  buildTerrain();
  applyToneMapping(); updatePost(); updateGrade(); updateFog(); updateSky(); updateSun(); updateLens(); updateFrame();
  applyRenderRegion(); // size the post buffers to the framed region (or full) for the loaded ratio
  refreshViewDropdown();
  // re-sync Animate-mode runtime state from the loaded params
  const T = params.timeline;
  if (T.inT == null) T.inT = 0;
  if (T.outT == null) T.outT = T.duration;
  if (!T.paramTiming) T.paramTiming = {};
  const fp = T.focusPoint || { x: 0, y: 0, z: 0 };
  focusPointV3.set(fp.x, fp.y, fp.z);
  afterimagePass.enabled = params.motionBlur.enabled;
  afterimagePass.uniforms.damp.value = params.motionBlur.damp;
  applyCamSensitivity();
  tl.baked = false; tl.bakeCache = null; // keyframes changed wholesale → drop any bake
  if (workspaceMode === 'animate') { buildTimeline(); renderPins(); refreshInsertViewDropdown(); updatePlayheadUI(); updateBakeBtn(); if (tlSavedSnapshot === null) tlMarkSaved(); else updateDirtyUI(); }
  // UI mode: ensure structure + re-render the loaded prototype
  if (!params.ui || !Array.isArray(params.ui.screens)) params.ui = { screens: [], entry: null };
  if (workspaceMode === 'ui') { uiRuntime.current = params.ui.entry || params.ui.screens[0]?.id || null; if (uiRuntime.current) uiShowScreen(uiRuntime.current); else { uiRenderScreen(null); rebuildUIChrome(); } }
  controls.enabled = !params.flyMode && workspaceMode !== 'ui';
  runT = 0;
  return n;
}

const refImg = document.getElementById('refimg');

const refInput = document.createElement('input');
refInput.type = 'file'; refInput.accept = 'image/*'; refInput.style.display = 'none';
document.body.appendChild(refInput);
function applyRef() {
  refImg.style.display = (refState.show && refImg.getAttribute('src')) ? 'block' : 'none';
  refImg.style.opacity = refState.opacity;
  refImg.style.objectFit = refState.fit;
}
function saveRefState() {
  try { localStorage.setItem('tg.ref', JSON.stringify({ opacity: refState.opacity, fit: refState.fit, img: refImg.getAttribute('src') || '' })); } catch (e) {}
}
refInput.addEventListener('change', (e) => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { refImg.src = r.result; refState.show = true; applyRef(); saveRefState(); gui.controllersRecursive().forEach((c) => c.updateDisplay()); setStatus('reference image loaded'); };
  r.readAsDataURL(f); refInput.value = '';
});
try { const st = JSON.parse(localStorage.getItem('tg.ref') || 'null'); if (st) { refState.opacity = st.opacity ?? 0.5; refState.fit = st.fit || 'contain'; if (st.img) refImg.src = st.img; } } catch (e) {}
if (!refImg.getAttribute('src')) refImg.src = './reference.jpg'; // committed default reference
applyRef();

const _a = new THREE.Vector3();
const _tan = new THREE.Vector3();
let flyTime = 0;

// ---- idle camera motion: a subtle "living camera" drift overlaid only on the rendered frame
// (saved/restored each frame so it never accumulates or fights the controls/timeline) ----
const _idlePos = new THREE.Vector3(), _idleQuat = new THREE.Quaternion();
const _idleRight = new THREE.Vector3(), _idleUp = new THREE.Vector3();
let idleApplied = false;
function applyIdleMotion(t) {
  if (!params.idleMotion || params.idleAmount <= 0) return;
  _idlePos.copy(camera.position); _idleQuat.copy(camera.quaternion);
  camera.updateMatrixWorld();
  _idleRight.setFromMatrixColumn(camera.matrixWorld, 0);
  _idleUp.setFromMatrixColumn(camera.matrixWorld, 1);
  const a = params.idleAmount, tt = t * params.idleSpeed;
  const sx = Math.sin(tt * 0.7) * 0.6 + Math.sin(tt * 1.9 + 1.3) * 0.4; // organic multi-sine
  const sy = Math.sin(tt * 0.9 + 2.1) * 0.5 + Math.sin(tt * 1.5) * 0.5;
  camera.position.addScaledVector(_idleRight, sx * a * 4.0).addScaledVector(_idleUp, sy * a * 3.0); // sway
  camera.rotateY(sx * a * 0.006); camera.rotateX(sy * a * 0.005); camera.rotateZ(Math.sin(tt * 0.5) * a * 0.004); // breathe
  camera.updateMatrixWorld();
  idleApplied = true;
}
function clearIdleMotion() {
  if (!idleApplied) return;
  camera.position.copy(_idlePos); camera.quaternion.copy(_idleQuat); camera.updateMatrixWorld();
  idleApplied = false;
}

// per-frame scene animation (time-driven uniforms, glow aim, runner/character) — shared by the
// realtime loop and the deterministic offline exporter so both stay in sync.
function advanceSceneTime(dt, ctime) {
  skyDome.position.copy(camera.position);
  skyMat.uniforms.uTime.value += dt;
  { // aim the background glow at the mountain summit
    const L = params.length;
    const cz = Math.min(L * 0.5, -L * 0.5 + params.peakPos * L);
    const sx = pathCenterX(cz, false);
    const sy = floorYAt(cz) + (params.peakEnable ? params.peakHeight : 0);
    skyMat.uniforms.uBgGlowDir.value.set(sx, sy, cz).sub(camera.position).normalize();
  }
  if (terrain && terrain.material.isShaderMaterial) terrain.material.uniforms.uTime.value += dt;
  if (flowLineMat && params.flowLines && params.lineAnim) flowLineMat.uniforms.uTime.value += dt; // flowing gold pulses
  if (params.grain > 0) gradePass.uniforms.uTime.value = (gradePass.uniforms.uTime.value + dt) % 100;

  if (flowCurve && (params.showRunner || params.flyMode || params.character)) {
    const prev = runT;
    runT = (runT + (params.flySpeed * dt) / curveLen) % 1;
    if (runT < prev) { // wrapped → new lap
      flyTime = 0;
      if (params.character) {
        resetSpheresLap();
        primeTraveler(runT); // lay a fresh wake behind the spawn (no clump, no streak to the mountain)
      }
    }
    flowCurve.getPointAt(runT, _p);
    runner.position.copy(_p);
  }
  runner.visible = params.showRunner && !params.character;

  // traveler character: head rides the path, filament wake trails behind
  traveler.group.visible = params.character;
  sphereGroup.visible = params.character;
  if (params.character && flowCurve) {
    flowCurve.getPointAt(runT, _p);
    _p.y += params.charFloat + Math.sin(ctime * 1.8) * params.charBob;
    _p.x += Math.sin(ctime * 0.9) * params.charSway;
    traveler.setHead(_p);
    traveler.update(dt, ctime);
    updateSpheres(dt, ctime);
    const frac = collectableCount ? Math.min(1, collectedCount / collectableCount) : 0;
    traveler.setFilamentCount(1 + Math.floor(frac * 5));
    traveler.setThickness(params.charThick + (params.charThickMax - params.charThick) * frac);
    traveler.setIntensity(params.charIntensity);
  }
}

// ---- deterministic offline export (WebCodecs) — frame-exact, render-speed-independent ----
let offlineExporting = false;
function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
async function exportOffline(w, h) {
  let mux;
  try { mux = await import('https://esm.sh/webm-muxer@5'); }
  catch (e) { console.warn('webm-muxer load failed', e); return false; } // → caller falls back to MediaRecorder
  if (!window.VideoEncoder) return false;
  const { Muxer, ArrayBufferTarget } = mux;
  const fps = Math.round(params.exportFps);
  const [inT, outT] = tlRange();
  const N = Math.max(2, Math.ceil((outT - inT) * fps));
  // supersample: render larger, then downscale to the target → retina-crisp anti-aliasing.
  // The composer keeps several HDR+MSAA targets at this size, so over-large buffers fail to
  // allocate → garbage/static. Cap both the longest edge AND total pixels to a safe budget.
  let ss = 2;
  if (w * 2 * h * 2 > 8.4e6 || Math.max(w, h) * 2 > 3968) ss = 1;
  const ssW = w * ss, ssH = h * ss;
  renderer.setPixelRatio(1);
  renderer.setSize(ssW, ssH, false);
  composer.setSize(ssW, ssH); bloomPass.setSize(ssW, ssH); afterimagePass.setSize(ssW, ssH);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  // actual drawing-buffer size (the GPU may clamp a very large request) — used for the downscale
  const aw = renderer.domElement.width, ah = renderer.domElement.height;
  setVignetteFrame(0, 0, 1, 1); // the export buffer IS the frame → vignette corner-to-corner
  const prevDither = ditherPass.uniforms.uAmount.value;
  ditherPass.uniforms.uAmount.value = 2.5 * ss; // the downscale averages dither down — compensate
  // high VP9 bitrate — smooth sky/fog gradients need lots of bits to avoid banding
  const bitrate = Math.min(120e6, Math.max(40e6, Math.round(w * h * fps * 0.4)));
  const muxer = new Muxer({ target: new ArrayBufferTarget(), video: { codec: 'V_VP9', width: w, height: h, frameRate: fps }, firstTimestampBehavior: 'offset' });
  const encoder = new VideoEncoder({ output: (c, meta) => muxer.addVideoChunk(c, meta), error: (e) => console.error('encoder', e) });
  encoder.configure({ codec: 'vp09.00.10.08', width: w, height: h, bitrate, framerate: fps, latencyMode: 'quality' });
  // offscreen canvas to downscale each supersampled frame to the encode size
  const down = document.createElement('canvas'); down.width = w; down.height = h;
  const dctx = down.getContext('2d'); dctx.imageSmoothingEnabled = true; dctx.imageSmoothingQuality = 'high';
  offlineExporting = true; exporting = true; tl.playing = false;
  focusMarker.visible = false; // never bake the focus marker into the export
  const frameDur = Math.round(1e6 / fps);
  try {
    for (let n = 0; n < N; n++) {
      const tsec = Math.min(outT, inT + n / fps);
      tl.t = tsec;
      sampleTimeline(tsec);          // drives camera + params (+ baked geometry morph)
      advanceSceneTime(1 / fps, tsec);
      applyIdleMotion(tsec);
      if (params.post) composer.render(); else renderer.render(scene, camera);
      dctx.drawImage(renderer.domElement, 0, 0, aw, ah, 0, 0, w, h); // supersample downscale (actual buffer)
      clearIdleMotion();
      const frame = new VideoFrame(down, { timestamp: n * frameDur, duration: frameDur });
      encoder.encode(frame, { keyFrame: n % fps === 0 });
      frame.close();
      updatePlayheadUI();
      if (n % 4 === 0) setStatus('exporting… ' + Math.round((n + 1) / N * 100) + '% (offline ' + w + '×' + h + ')');
      if (encoder.encodeQueueSize > 6 || n % 3 === 0) await new Promise(r => requestAnimationFrame(r)); // yield + backpressure
    }
    await encoder.flush();
    muxer.finalize();
    downloadBlob(new Blob([muxer.target.buffer], { type: 'video/webm' }), 'martell-' + Date.now() + '.webm');
    setStatus(`export complete — ${w}×${h}${ss > 1 ? ' (×' + ss + ' supersampled)' : ''}, ${N} frames @ ${fps}fps`);
  } catch (e) {
    console.error(e); setStatus('offline export failed: ' + e.message);
  } finally {
    encoder.close?.();
    ditherPass.uniforms.uAmount.value = prevDither;
    offlineExporting = false; exporting = false;
    restoreExportSize(); // re-applies the framed/full render region for the live view
    stopTimeline();
  }
  return true;
}

// ---- still-image export (framed PNG of the current live view) ----
async function exportPNG() {
  if (exporting) { setStatus('busy — an export is already running'); return; }
  if (rigMode) setRigMode(false); // capture the shot camera's framed view, not the rig
  const ratio = FRAME_RATIOS[params.frameRatio] || (innerWidth / innerHeight);
  let h = Math.round(params.exportResHeight), w = Math.round(h * ratio);
  w -= w % 2; h -= h % 2;
  // same supersample budget as the WebM export (over-large buffers fail to allocate → garbage)
  let ss = 2;
  if (w * 2 * h * 2 > 8.4e6 || Math.max(w, h) * 2 > 3968) ss = 1;
  const ssW = w * ss, ssH = h * ss;
  preExportSize = { w: innerWidth, h: innerHeight, aspect: camera.aspect, pr: renderer.getPixelRatio() };
  const fmWas = focusMarker.visible;
  const prevDither = ditherPass.uniforms.uAmount.value;
  offlineExporting = true; exporting = true; // freeze the render loop so we capture exactly this frame
  focusMarker.visible = false;               // never bake the focus marker into the still
  try {
    renderer.setPixelRatio(1);
    renderer.setSize(ssW, ssH, false);
    renderer.setScissorTest(false); renderer.setViewport(0, 0, ssW, ssH); // never inherit a framed-render scissor
    composer.setSize(ssW, ssH); bloomPass.setSize(ssW, ssH); afterimagePass.setSize(ssW, ssH);
    camera.aspect = w / h; camera.updateProjectionMatrix();
    setVignetteFrame(0, 0, 1, 1);              // the export buffer IS the frame → vignette corner-to-corner
    ditherPass.uniforms.uAmount.value = 2.5 * ss; // the downscale averages dither down — compensate
    setStatus('rendering PNG ' + w + '×' + h + (ss > 1 ? ' (×' + ss + ')' : '') + '…');
    await new Promise(r => requestAnimationFrame(r)); // let the resize settle
    const aw = renderer.domElement.width, ah = renderer.domElement.height;
    if (params.post) composer.render(); else renderer.render(scene, camera);
    const down = document.createElement('canvas'); down.width = w; down.height = h;
    const dctx = down.getContext('2d'); dctx.imageSmoothingEnabled = true; dctx.imageSmoothingQuality = 'high';
    dctx.drawImage(renderer.domElement, 0, 0, aw, ah, 0, 0, w, h); // supersample downscale (actual buffer)
    const blob = await new Promise(res => down.toBlob(res, 'image/png'));
    if (!blob) throw new Error('toBlob returned null');
    downloadBlob(blob, 'martell-' + Date.now() + '.png');
    setStatus(`saved PNG — ${w}×${h}${ss > 1 ? ' (×' + ss + ' supersampled)' : ''}`);
  } catch (e) {
    console.error(e); setStatus('PNG export failed: ' + e.message);
  } finally {
    ditherPass.uniforms.uAmount.value = prevDither;
    focusMarker.visible = fmWas;
    offlineExporting = false; exporting = false;
    restoreExportSize(); // re-applies the framed/full render region for the live view
  }
}

renderer.setAnimationLoop(() => {
  if (offlineExporting) return; // the offline exporter drives rendering itself

  const dt = Math.min(0.05, clock.getDelta());

  fpsEl.style.display = params.showFps ? 'block' : 'none';
  if (params.showFps) {
    fpsAccum += dt; fpsFrames++;
    if (fpsAccum >= 0.5) { fpsEl.textContent = (fpsFrames / fpsAccum).toFixed(0) + ' fps'; fpsAccum = 0; fpsFrames = 0; }
  }

  advanceSceneTime(dt, clock.elapsedTime);

  if (tl.playing) {
    updateTimeline(dt);
    hud.style.display = 'none';
  } else if (camAnim.playing) {
    updateCamAnim(dt);
    hud.style.display = 'none';
  } else if (params.flyMode && flowCurve) {
    flyTime += dt;
    flowCurve.getPointAt(runT, _p);
    flowCurve.getPointAt(Math.min(0.999, runT + params.flyLookAhead / curveLen), _a);
    if (params.character) {
      // third-person chase: sit behind + above and look AT the character
      flowCurve.getTangentAt(runT, _tan);
      const hy = _p.y + params.charFloat;
      camera.position.set(_p.x - _tan.x * params.flyBehind, hy + params.flyHeight, _p.z - _tan.z * params.flyBehind);
      camera.lookAt(_p.x, hy, _p.z);
    } else {
      camera.position.set(_p.x, _p.y + params.flyHeight, _p.z);
      camera.lookAt(_a.x, _a.y + params.flyHeight * 0.5, _a.z);
    }
    hud.style.display = workspaceMode === 'ui' ? 'none' : 'block'; // hide debug HUD under a UI mockup
    const dist = Math.round(runT * curveLen);
    hud.innerHTML = `DISTANCE <b>${dist} M</b> &nbsp;·&nbsp; TIME <b>${pad((flyTime / 60) | 0)}:${pad((flyTime % 60) | 0)}</b> &nbsp;·&nbsp; SPEED <b>${params.flySpeed}</b>`;
  } else if (!rigMode) {
    hud.style.display = 'none';
    controls.update();
  }

  updateFocusMarker();
  if (viewerMode) updateViewerBar(); // keep the client player bar in sync
  if (rigMode) {
    hud.style.display = 'none';
    editControls.update();
    camHelper.update();
    if (rigTarget === 'focus' && !gizmoDragging) focusHandle.position.copy(focusPointV3); // keep the focus gizmo on the point when not dragging
    orientFocusMarker(editCam);
    renderer.render(scene, editCam);   // main viewport = free director camera (with frustum + gizmo)
    renderPip();                       // corner preview = what the shot camera sees
  } else {
    // never show the rig gizmos through the shot lens — they sit at the camera position and would
    // render as a huge zoomed-in blob (renderPip restores them to visible, so force-hide here)
    camHelper.visible = false; transformCtrl.visible = false;
    orientFocusMarker(camera);
    applyIdleMotion(clock.elapsedTime);
    const framed = canFramedOnly();
    if (framed) {
      // black out the whole canvas (the letterbox), then aim the render at just the framed rect —
      // the composer buffers are already sized to it (applyRenderRegion), so only those pixels cost.
      const fr = framedRect(), H = innerHeight;
      renderer.setClearColor(0x000000, 1);
      renderer.setScissorTest(false); renderer.setViewport(0, 0, innerWidth, innerHeight); renderer.clear();
      renderer.setViewport(fr.x, H - fr.y - fr.h, fr.w, fr.h);
      renderer.setScissor(fr.x, H - fr.y - fr.h, fr.w, fr.h);
      renderer.setScissorTest(true);
    }
    if (params.post) composer.render();
    else renderer.render(scene, camera);
    if (framed) { renderer.setScissorTest(false); renderer.setViewport(0, 0, innerWidth, innerHeight); }
    if (!exporting && !viewerMode) drainThumbQueue(); // fill ≤1 film-strip thumbnail per frame (saves/restores its own GL state)
    clearIdleMotion();
  }
});

addEventListener('keydown', (e) => {
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return; // don't steal typing
  if (viewerMode) return; // client viewer: the tool keyboard is locked off
  if (modalResolve) { if (e.key === 'Escape') closeModal(null); return; } // a modal owns the keyboard
  const k = e.key && e.key.toLowerCase();
  const meta = e.metaKey || e.ctrlKey;
  if (meta && k === 's') { e.preventDefault(); saveCurrentAnimCloud(); return; } // ⌘/Ctrl+S → save animation to cloud
  if (e.key === 'Tab') { e.preventDefault(); toggleCleanView(); return; } // hide tool chrome → game view
  if (e.key === 'Escape' && focusPicking) { endFocusPick(); setStatus('focus pick cancelled'); return; }
  // copy / paste keyframes (⌘/Ctrl+C / V) in Animate mode — must come before the bare 'c' rig toggle
  if (meta && workspaceMode === 'animate' && (k === 'c' || k === 'v')) {
    e.preventDefault();
    if (k === 'c') tlCopyKeys(); else tlPasteKeys();
    return;
  }
  if (meta && k === 'p') { e.preventDefault(); openParamSearch(); return; } // ⌘/Ctrl+P → search/filter the parameters
  if (k === 'p' && !meta) { exportPNG(); return; } // capture the current framed view as PNG (works in clean/runner view)
  if (k === 's') { guiVisible = !guiVisible; guiVisible ? gui.show() : gui.hide(); }
  if (k === 'r') { refState.show = !refState.show; applyRef(); gui.controllersRecursive().forEach((c) => c.updateDisplay()); }
  if (e.key === ']') expandAllFolders();   // expand all sections
  if (e.key === '[') collapseAllFolders(); // collapse all sections
  if (k === 'c' && !meta) { setRigMode(!rigMode); }
  if (rigMode) {
    if (k === 't') setTransformMode('translate');
    if (k === 'y') setTransformMode('rotate');
    if (k === 'f') setRigTarget(rigTarget === 'focus' ? 'camera' : 'focus');
  }
  // Animate-mode shortcuts
  if (workspaceMode === 'animate') {
    if (k === 'delete' || k === 'backspace') { e.preventDefault(); tlDeleteSelected(); }
    if (k === ' ' || e.code === 'Space') {
      e.preventDefault();
      if (tl.playing) pauseTimeline();
      else playTimeline(tl.t >= tlRange()[1]);
    }
    if (k === 'b') { setInPoint(tl.t); }   // B = in-point at the playhead
    if (k === 'n') { setOutPoint(tl.t); }  // N = out-point at the playhead
  }
});

let _paramSearchSaved = null;
function ensureParamSearchBox() {
  let box = document.getElementById('paramSearch'); if (box) return box;
  box = document.createElement('div'); box.id = 'paramSearch';
  box.innerHTML = '<input type="text" placeholder="🔍  Search parameters…   (Esc to close)" spellcheck="false" autocomplete="off">';

}
function openParamSearch() {

function filterParams(q) {
  q = (q || '').trim().toLowerCase();
  const ctrls = gui.controllersRecursive(), folders = gui.foldersRecursive();
  if (!q) { ctrls.forEach(c => { c.domElement.style.display = ''; }); folders.forEach(f => { f.domElement.style.display = ''; }); return; }
  const hit = new Set();
  ctrls.forEach(c => {
    const m = (((c._name || '') + ' ' + (c.property || '')).toLowerCase()).includes(q);
    c.domElement.style.display = m ? '' : 'none';
    if (m) { let f = c.parent; while (f && f !== gui) { hit.add(f); f = f.parent; } }
  });
  folders.forEach(f => { if (hit.has(f)) { f.domElement.style.display = ''; f.open(); } else f.domElement.style.display = 'none'; });
}
function closeParamSearch() {
  const box = document.getElementById('paramSearch'); if (box) box.classList.remove('show');
  gui.controllersRecursive().forEach(c => { c.domElement.style.display = ''; });
  gui.foldersRecursive().forEach((f, i) => { if (_paramSearchSaved && _paramSearchSaved[i] != null) (_paramSearchSaved[i] ? f.close() : f.open()); });
  if (workspaceMode === 'animate' && typeof setParamTab === 'function') setParamTab(paramTab); // restore the tab's folder visibility
  else gui.foldersRecursive().forEach(f => f.show());
  _paramSearchSaved = null;

      // shift+click: toggle this key in the multi-selection (for batch easing); no drag/scrub
      if (tl.selSet.has(idx)) tl.selSet.delete(idx); else tl.selSet.add(idx);
      tl.selected = tl.selSet.has(idx) ? idx : (tl.selSet.size ? [...tl.selSet][tl.selSet.size - 1] : -1);
      renderPins();
    } else {
      clearHeldEdits(); // selecting a key = move to its context; any prior live edit is already committed
      tl.selected = idx; tl.selSet = new Set([idx]);
      tl.dragKey = idx;
      renderPins();
      scrubTimeline(params.timeline.keys[idx].t); // move playhead + preview to this key
      tlTrack.setPointerCapture(e.pointerId);
    }
  } else {
    tl.dragPlayhead = true;
    tlTrack.setPointerCapture(e.pointerId);
    scrubTimeline(trackTimeFromEvent(e));
  }
});
tlTrack.addEventListener('pointermove', (e) => {
  if (tl.dragKey >= 0) {
    const k = params.timeline.keys[tl.dragKey]; if (!k) return;
    { const raw = trackTimeFromEvent(e); const t = e.altKey ? raw : tlSnapTime(raw, tl.dragKey); // hold Alt to bypass snapping
      k.t = Math.max(0, Math.min(params.timeline.duration, t)); }
    const ref = k; params.timeline.keys.sort((a, b) => a.t - b.t);
    tl.dragKey = tl.selected = params.timeline.keys.indexOf(ref);
    tl.selSet = new Set([tl.selected]);

    scrubTimeline(trackTimeFromEvent(e));
  }
});
function endTrackDrag(e) {

  try { tlTrack.releasePointerCapture(e.pointerId); } catch (_) {}
  updateDirtyUI();
}
tlTrack.addEventListener('pointerup', endTrackDrag);
tlTrack.addEventListener('pointercancel', endTrackDrag);
// drag the green in/out markers to set the play/export range (snaps; Alt bypasses)
['tlIn', 'tlOut'].forEach((id) => {
  const el = document.getElementById(id); if (!el) return;
  el.addEventListener('pointerdown', (e) => {
    e.stopPropagation(); // don't let the track scrub the playhead
    el.setPointerCapture(e.pointerId);
    const isIn = id === 'tlIn';
    const move = (ev) => { const raw = trackTimeFromEvent(ev); const t = ev.altKey ? raw : tlSnapTime(raw, -1); if (isIn) setInPoint(t); else setOutPoint(t); updatePlayheadUI(); };
    const up = (ev) => { try { el.releasePointerCapture(ev.pointerId); } catch (_) {} el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); updateDirtyUI(); };
    el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); move(e);
  });
});

// Startup defaults: prefer the cloud startup default (D1, on Cloudflare Pages), then fall back to
// the committed parameters.json, then the baked-in defaults (e.g. opened via file:// / static host).
function applyStartup(d, label) {
  applyLoadedParams(d);
  if (params.defaultView && params.cameraBookmarks[params.defaultView]) {
    goView(params.defaultView);
    camIndex = Object.keys(params.cameraBookmarks).indexOf(params.defaultView);
  }
  syncRunBtn();
  setStatus(label);
}
async function bootDefaults() {
  try {
    const def = await cloudApi.getDefault();      // GET /api/default → {name,data} or null
    if (def && def.data) { applyStartup(def.data, `loaded cloud default "${def.name}"`); return; }
  } catch (_) { /* no Functions (static host / offline) → fall through */ }
  try {
    const r = await fetch('./parameters.json');
    const d = r.ok ? await r.json() : null;

  } catch (_) { /* baked-in defaults remain */ }
}
const _shareId = new URLSearchParams(location.search).get('v');
if (_shareId) enterViewer(_shareId); else bootDefaults(); // /?v=<id> → read-only client viewer
