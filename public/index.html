<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Martell</title>
<style>
  /* Official Martell brand fonts (Martell Web display + Martel Sans body) */
  @font-face { font-family: 'Martell Web'; font-weight: 400; font-display: swap; src: url('./ui-assets/martell-web-regular.ttf') format('truetype'); }
  @font-face { font-family: 'Martell Web'; font-weight: 500; font-display: swap; src: url('./ui-assets/martell-web-medium.ttf') format('truetype'); }
  @font-face { font-family: 'Martell Web'; font-weight: 700; font-display: swap; src: url('./ui-assets/martell-web-bold.ttf') format('truetype'); }
  @font-face { font-family: 'Martel Sans'; font-weight: 400; font-display: swap; src: url('./ui-assets/martel-sans-regular.ttf') format('truetype'); }
  :root {
    color-scheme: dark;
    /* surfaces — one deep blue-slate hue, lightness-stepped (the night over the dunes) */
    --bg: #05060a;                 /* canvas / the 3D render */
    --s0: rgba(12,15,24,.82);      /* floating panel base (glass) */
    --s0-solid: #0c0f18;           /* opaque panel (lil-gui) */
    --s1: rgba(38,44,62,.92);      /* controls / buttons */
    --s2: rgba(60,70,98,.95);      /* control hover */
    --inset: rgba(6,8,14,.5);      /* inputs / tracks (recessed) */
    --overlay: rgba(16,20,32,.98); /* modals / dropdowns */
    /* text hierarchy */
    --fg: #e6eaf4; --fg-2: #c2cadd; --fg-3: #9aa3b5; --fg-muted: #6b748a;
    /* borders — quiet → strong */
    --bd: rgba(255,255,255,.10); --bd-soft: rgba(255,255,255,.055); --bd-strong: rgba(140,160,210,.3);
    /* accent: the gold trail / cognac — one accent, ink text on it */
    --gold: #ffd633; --gold-dim: rgba(255,214,51,.13); --ink: #0c0f18; --focus: rgba(255,214,51,.6);
    /* semantic */
    --commit: #7dd87d; --danger: #e0683c; --pin: #8094cf;
    /* radii / motion */
    --r-sm: 7px; --r-md: 11px; --r-lg: 14px;
    --tx: 110ms cubic-bezier(.2,.6,.2,1); --shadow-pop: 0 16px 50px rgba(0,0,0,.55);
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); font-family: system-ui, sans-serif; }
  /* unified interactive polish: quiet transitions + one gold focus ring (was missing everywhere) */
  #toolbar button, #timeline button, #timeline select, #rigbar button, #uibar button, #uibar select,
  .animChip, #modalBtns button, #guiBar button, #guiTabs button {
    transition: background var(--tx), color var(--tx), border-color var(--tx), box-shadow var(--tx);
  }
  #toolbar button:focus-visible, #timeline button:focus-visible, #timeline select:focus-visible,
  #timeline input:focus-visible, #rigbar button:focus-visible, #uibar button:focus-visible,
  #uibar select:focus-visible, #uibar input:focus-visible, .animChip:focus-visible,
  #modalBtns button:focus-visible, #modalInput:focus-visible, #guiBar button:focus-visible,
  #guiTabs button:focus-visible {
    outline: none; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--focus);
  }
  #app { position: fixed; inset: 0; }
  #info {
    position: fixed; left: 12px; top: 12px; z-index: 10;
    color: var(--fg-2); font-size: 12px; line-height: 1.5;
    background: var(--s0); padding: 9px 12px; border-radius: var(--r-md);
    border: 1px solid var(--bd-soft); backdrop-filter: blur(7px);
    pointer-events: none; max-width: 340px;
  }
  #info b { color: var(--gold); font-weight: 600; }
  #toolbar { margin-top: 9px; display: flex; gap: 5px; pointer-events: auto; }
  #toolbar button {
    pointer-events: auto; cursor: pointer; font: inherit; font-size: 11px;
    color: var(--fg-2); background: var(--s1); border: 1px solid var(--bd);
    padding: 5px 10px; border-radius: var(--r-sm);
  }
  #toolbar button:hover { background: var(--s2); color: var(--fg); }
  #toolbar button.on { color: var(--ink); background: var(--gold); border-color: var(--gold); }
  #status {
    position: fixed; right: 12px; bottom: 12px; z-index: 10;
    color: var(--fg-3); font-size: 12px; background: var(--s0); backdrop-filter: blur(7px);
    border: 1px solid var(--bd-soft); padding: 6px 11px; border-radius: var(--r-md);
  }
  #hud {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 10;
    color: var(--fg); font-size: 13px; letter-spacing: .08em; display: none;
    background: var(--s0); padding: 8px 18px; border-radius: var(--r-md);
    border: 1px solid var(--bd-strong); backdrop-filter: blur(7px); font-variant-numeric: tabular-nums;
  }
  #hud b { color: var(--gold); font-size: 16px; }
  #refimg {
    position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain;
    z-index: 8; display: none; pointer-events: none;
  }
  #timeline {
    position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 11;
    display: none; flex-direction: column; gap: 8px;
    background: var(--s0); border: 1px solid var(--bd);
    border-radius: var(--r-md); padding: 11px 13px; color: var(--fg-2);
    font: 12px system-ui, sans-serif; backdrop-filter: blur(10px); box-shadow: 0 10px 40px rgba(0,0,0,.35);
  }
  #timeline.show { display: flex; }
  #timeline button, #timeline select, #timeline input {
    font: inherit; color: var(--fg-2); background: var(--s1);
    border: 1px solid var(--bd); border-radius: var(--r-sm); padding: 4px 9px; cursor: pointer;
  }
  #timeline button:hover { background: var(--s2); color: var(--fg); }
  #timeline button.on { color: var(--ink); background: var(--gold); border-color: var(--gold); }
  #timeline input { background: var(--inset); }
  #timeline input[type=number] { width: 62px; cursor: text; }
  #timeline label { display: inline-flex; align-items: center; gap: 4px; color: var(--fg-3); }
  #tlTransport, #tlInspector { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #tlTransport { gap: 11px; }
  /* transport split into playback / keys / tools with hairline separators */
  .tlGroup { display: flex; gap: 5px; align-items: center; }
  .tlGroup:not(:last-child)::after { content: ''; align-self: center; width: 1px; height: 19px; background: var(--bd); margin-left: 6px; }
  #tlTime { min-width: 98px; font-variant-numeric: tabular-nums; color: var(--fg); font-weight: 600; letter-spacing: .01em; }
  #tlTime .tdur { color: var(--fg-muted); font-weight: 400; }
  /* ── saved-animations row ─────────────────────────────────────────── */
  #tlAnimRow { display: flex; align-items: center; gap: 10px; min-height: 18px; }
  #tlAnimLabel { font-family: ui-sans-serif, system-ui, sans-serif; color: var(--gold); font-size: 10px; font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; flex: none; opacity: .9; }
  #tlDirty { margin-left: auto; flex: none; display: none; align-items: center; gap: 6px; color: var(--gold);
    font-size: 10px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  #tlDirty.show { display: inline-flex; }
  #tlDirty::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--gold);
    box-shadow: 0 0 7px var(--gold); animation: tlPulse 1.8s ease-in-out infinite; }
  @keyframes tlPulse { 50% { opacity: .3; } }
  /* ── zoom/scroll viewport for the film strip ──────────────────────── */
  #tlScroll { overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; scrollbar-color: var(--bd-strong) transparent; }
  #tlScroll::-webkit-scrollbar { height: 7px; }
  #tlScroll::-webkit-scrollbar-thumb { background: var(--bd-strong); border-radius: 99px; }
  #tlScroll::-webkit-scrollbar-track { background: transparent; }
  #tlInner { width: 100%; position: relative; }
  /* ── ruler: adaptive second ticks ─────────────────────────────────── */
  #tlRuler { position: relative; height: 18px; user-select: none; }
  .tlTick { position: absolute; bottom: 0; width: 1px; height: 4px; background: var(--bd-strong); transform: translateX(-.5px); }
  .tlTick.maj { height: 6px; background: rgba(255,255,255,.28); }
  .tlTickLbl { position: absolute; top: 0; transform: translateX(-50%); font: 10px ui-monospace, monospace; line-height: 1;
    color: var(--fg-3); font-variant-numeric: tabular-nums; white-space: nowrap; pointer-events: none; }
  /* ── the film-strip track: a dark stage with a faint per-second grid ─ */
  #tlTrack {
    position: relative; height: 60px; border-radius: var(--r-sm); margin-top: 1px;
    background: #080a11; background-image: linear-gradient(90deg, rgba(255,214,51,.06) 1px, transparent 1px);
    background-size: var(--tlsec, 12.5%) 100%; background-position-x: -.5px;
    border: 1px solid var(--bd-soft); box-shadow: inset 0 1px 4px rgba(0,0,0,.45);
    overflow: hidden; cursor: pointer; touch-action: none;
  }
  #tlPlayhead { position: absolute; top: 0; bottom: 0; width: 2px; left: 0; margin-left: -1px;
    background: #fff; pointer-events: none; z-index: 5; box-shadow: 0 0 7px rgba(255,214,51,.85); }
  #tlPlayhead::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    border-style: solid; border-width: 7px 5px 0 5px; border-color: #fff transparent transparent transparent;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  #tlPre, #tlPost { position: absolute; top: 0; bottom: 0; left: 0; width: 0; background: rgba(4,5,9,.62); pointer-events: none; z-index: 1; }
  #tlIn, #tlOut { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--commit); z-index: 4; cursor: ew-resize; }
  #tlIn::after, #tlOut::after { content: ''; position: absolute; top: 0; width: 0; height: 0; border-style: solid; }
  #tlIn::after { left: 0; border-width: 6px 0 0 6px; border-color: var(--commit) transparent transparent transparent; }
  #tlOut::after { right: 0; border-width: 6px 6px 0 0; border-color: var(--commit) transparent transparent transparent; }
  /* keyframe = a film-strip cell (the rendered thumbnail fills it) */
  .tlPin {
    position: absolute; top: 8px; bottom: 8px; width: 26px; margin-left: -13px; z-index: 2;
    background: var(--s1) center/cover no-repeat; border: 1px solid var(--bd-strong); border-radius: 3px;
    cursor: grab; overflow: hidden; transition: box-shadow var(--tx), border-color var(--tx), transform var(--tx);
  }
  .tlPin::before { content: ''; position: absolute; left: 50%; top: -8px; width: 1px; height: 8px; background: var(--bd-strong); transform: translateX(-.5px); }
  .tlPin .pinIdx { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; font: 700 9px ui-monospace, monospace;
    color: var(--fg); background: linear-gradient(transparent, rgba(0,0,0,.78)); padding: 1px 0 0; letter-spacing: .02em; }
  .tlPin:hover { border-color: var(--gold); transform: translateY(-1px); }
  .tlPin.sel { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
  .tlPin.primary { border-color: #fff; box-shadow: 0 0 0 1.5px #fff, 0 0 11px rgba(255,214,51,.9); z-index: 3; }
  .tlPin.follow::after { content: '🛤'; position: absolute; top: 1px; left: 2px; font-size: 8px; filter: drop-shadow(0 0 2px #000); }
  #tlIn::before, #tlOut::before { content: ''; position: absolute; inset: 0 -5px; cursor: ew-resize; } /* wider grab for dragging */
  #tlSelCount { position: absolute; left: 50%; top: -10px; transform: translate(-50%, -100%); display: none; z-index: 14;
    background: var(--gold); color: var(--ink); font: 600 11px system-ui; letter-spacing: .02em; white-space: nowrap;
    padding: 4px 12px; border-radius: 999px; box-shadow: 0 6px 22px rgba(0,0,0,.45); pointer-events: none; }
  #tlSelCount.show { display: block; }
  #tlUpdateKey { display: none; color: var(--ink); background: var(--commit); border-color: var(--commit); }
  #tlUpdateKey.show { display: inline-block; }
  #tlEase {
    display: none; position: absolute; bottom: calc(100% + 10px); left: 0; z-index: 13;
    padding: 9px; background: var(--overlay); border: 1px solid var(--bd-strong);
    border-radius: var(--r-md); box-shadow: var(--shadow-pop); flex-direction: column; gap: 6px;
  }
  #tlEase.show { display: flex; }
  #tlEaseCanvas { background: var(--inset); border-radius: var(--r-sm); cursor: crosshair; touch-action: none; }
  #tlEaseHint { font: 10px ui-sans-serif, system-ui; color: var(--fg-3); max-width: 150px; }
  #tlBake.on { color: var(--ink); background: var(--commit); border-color: var(--commit); }
  /* cloud-animation quick-load strip */
  #tlAnimStrip { display: flex; gap: 6px; align-items: center; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; flex: 1; min-width: 0; }
  .animChip { flex: 0 0 auto; padding: 4px 11px; border-radius: 999px; cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center;
    background: var(--s1); border: 1px solid var(--bd); color: var(--fg-2); font: 11px ui-sans-serif, system-ui; }
  .animChip:hover { background: var(--s2); color: var(--fg); }
  .animChip.on { color: var(--ink); background: var(--gold); border-color: var(--gold); font-weight: 600; }
  .animChip.newAnim { background: transparent; border-style: dashed; border-color: var(--bd-strong); color: var(--gold); }
  .animChip.newAnim:hover { background: var(--gold-dim); border-color: var(--gold); }
  .animChip .chipDel { margin-left: 8px; opacity: .4; font-weight: 700; line-height: 1; padding: 0 3px; border-radius: 4px; }
  .animChip .chipDel:hover { opacity: 1; color: #fff; background: var(--danger); }
  .animChip.on .chipDel { opacity: .65; }
  .animChip.on .chipDel:hover { color: #fff; background: #7a1d10; opacity: 1; }
  .animChip .chipEdit { margin-left: 7px; opacity: .4; line-height: 1; padding: 0 2px; border-radius: 4px; font-size: 10px; }
  .animChip .chipEdit:hover { opacity: 1; color: var(--ink); background: var(--gold); }
  .animChip.on .chipEdit { opacity: .65; }
  .animChip.on .chipEdit:hover { opacity: 1; color: var(--ink); }
  .animSelect { flex: 0 0 auto; max-width: 190px; padding: 4px 10px !important; border-radius: 999px !important;
    background: var(--s1); border: 1px solid var(--bd); color: var(--fg-2); font: 11px ui-sans-serif, system-ui; cursor: pointer; }
  .animSelect:hover { background: var(--s2); color: var(--fg); }
  /* custom saved-animation picker (dark popover with rendered previews) */
  .animMenuBtn { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; cursor: pointer; white-space: nowrap;
    background: var(--s1); border: 1px solid var(--bd); color: var(--fg-2); font: 11px ui-sans-serif, system-ui; }
  .animMenuBtn:hover { background: var(--s2); color: var(--fg); }
  #animMenu, #uiScreenMenu { display: none; position: fixed; z-index: 40; width: 312px; max-height: min(64vh, 460px); overflow-y: auto;
    padding: 6px; background: var(--overlay); border: 1px solid var(--bd-strong); border-radius: var(--r-md); box-shadow: var(--shadow-pop);
    scrollbar-width: thin; scrollbar-color: var(--bd-strong) transparent; }
  #animMenu.show, #uiScreenMenu.show { display: block; }
  #animMenu .amHdr, #uiScreenMenu .amHdr { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 6px 8px; }
  #animMenu .amHdr span, #uiScreenMenu .amHdr span { font: 700 9px ui-sans-serif, system-ui; letter-spacing: .12em; text-transform: uppercase; color: var(--fg-muted); }
  #amSearch { width: 130px; padding: 4px 8px; border-radius: var(--r-sm); border: 1px solid var(--bd); background: var(--inset); color: var(--fg); font: 11px ui-sans-serif, system-ui; outline: none; }
  #amSearch:focus { border-color: var(--gold); }
  .animMenuRow { display: flex; align-items: center; gap: 10px; padding: 5px 6px; border-radius: var(--r-sm); cursor: pointer; }
  .animMenuRow:hover { background: var(--s1); }
  .animMenuRow.cur { background: var(--gold-dim); box-shadow: inset 0 0 0 1px rgba(255,214,51,.4); }
  .amThumb { width: 30px; height: 53px; flex: 0 0 auto; border-radius: 3px; background: #0a0c14 center/cover no-repeat; border: 1px solid var(--bd-soft); position: relative; }
  .amThumb.load::after { content: ''; position: absolute; inset: 0; margin: auto; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--bd-strong); border-top-color: var(--gold); animation: vspin .8s linear infinite; }
  .amName { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg-2); font: 12px ui-sans-serif, system-ui; }
  .animMenuRow:hover .amName, .animMenuRow.cur .amName { color: var(--fg); }
  .amAct { opacity: 0; flex: 0 0 auto; padding: 2px 6px; border-radius: 5px; font-size: 11px; line-height: 1; color: var(--fg-3); }
  .animMenuRow:hover .amAct { opacity: .65; }
  .amAct:hover { opacity: 1 !important; }
  .amAct.ren:hover { color: var(--ink); background: var(--gold); }
  .amAct.del:hover { color: #fff; background: var(--danger); }
  #animMenu .amEmpty, #uiScreenMenu .amEmpty { color: var(--fg-muted); font: 11px ui-sans-serif, system-ui; padding: 10px 6px; text-align: center; }
  /* UI-screen SVG overlay (fills the framed stage) */
  #uiStage .uipl-svg { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; user-select: none; }
  #uiStage .uipl-svgwarn { position: absolute; left: 8px; bottom: 8px; font: 10px ui-monospace, monospace; color: var(--gold);
    background: rgba(4,6,12,.7); padding: 3px 7px; border-radius: 5px; pointer-events: none; }
  body.present #uiStage .uipl-svgwarn, html.viewer #uiStage .uipl-svgwarn { display: none; }
  /* ⌘/Ctrl+P parameter search */
  #paramSearch { display: none; position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 45; }
  #paramSearch.show { display: block; }
  #paramSearch input { width: min(80vw, 360px); padding: 10px 16px; border-radius: 999px; border: 1px solid var(--bd-strong);
    background: var(--overlay); color: var(--fg); font: 13px system-ui, sans-serif; outline: none; box-shadow: var(--shadow-pop); }
  #paramSearch input:focus { border-color: var(--gold); box-shadow: var(--shadow-pop), 0 0 0 3px var(--gold-dim); }
  /* modal (name / confirm) */
  #modalBackdrop { display: none; position: fixed; inset: 0; z-index: 50; background: rgba(4,6,12,.6);
    backdrop-filter: blur(3px); align-items: center; justify-content: center; }
  #modalBackdrop.show { display: flex; }
  #modalBox { min-width: 340px; max-width: 90vw; background: var(--overlay); border: 1px solid var(--bd-strong);
    border-radius: var(--r-lg); box-shadow: var(--shadow-pop); padding: 20px; color: var(--fg);
    font: 13px system-ui, sans-serif; display: flex; flex-direction: column; gap: 13px; }
  #modalTitle { font-weight: 600; font-size: 14px; color: var(--fg); letter-spacing: .01em; }
  #modalInput { padding: 10px 12px; border-radius: var(--r-sm); border: 1px solid var(--bd-strong);
    background: var(--inset); color: var(--fg); font: 13px system-ui; outline: none; }
  #modalInput:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-dim); }
  #modalMsg { color: var(--fg-3); line-height: 1.5; }
  #modalBtns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  #modalBtns button { padding: 8px 15px; border-radius: var(--r-sm); border: 1px solid var(--bd);
    background: var(--s1); color: var(--fg-2); font: 13px system-ui; cursor: pointer; }
  #modalBtns button:hover { background: var(--s2); color: var(--fg); }
  #modalBtns button.primary { color: var(--ink); background: var(--gold); border-color: var(--gold); font-weight: 600; }
  #modalBtns button.danger { color: #fff; background: var(--danger); border-color: var(--danger); }
  #tlLanes { display: none; max-height: 168px; overflow-y: auto; margin-top: 2px; padding: 3px 0 1px; }
  #tlLanes.show { display: block; }
  .laneEmpty { color: var(--fg-muted); font: 11px ui-sans-serif, system-ui; padding: 6px 2px; }
  .lane { display: flex; align-items: center; gap: 8px; height: 22px; }
  .laneLbl { width: 120px; flex: none; color: var(--fg-2); font: 10px ui-monospace, monospace; text-align: left;
    overflow: hidden; white-space: nowrap; cursor: default;
    -webkit-mask-image: linear-gradient(90deg, #000 78%, transparent); mask-image: linear-gradient(90deg, #000 78%, transparent); }
  .laneTrack { position: relative; flex: 1; height: 15px; background: #080a11; border: 1px solid var(--bd-soft); border-radius: var(--r-sm); }
  .laneBar { position: absolute; top: 1px; bottom: 1px; background: var(--gold-dim); border: 1px solid rgba(255,214,51,.4);
    border-radius: 4px; cursor: grab; min-width: 5px; transition: filter var(--tx); }
  .laneBar:hover { filter: brightness(1.45); }
  .laneBar.set { background: var(--gold-dim); box-shadow: inset 0 0 0 1px var(--gold); border-color: var(--gold); }
  .laneH { position: absolute; top: 0; bottom: 0; width: 7px; cursor: ew-resize; }
  .laneH.l { left: -2px; } .laneH.r { right: -2px; }
  .laneTime { position: absolute; bottom: calc(100% + 3px); font: 9px ui-monospace, monospace; color: var(--gold);
    white-space: nowrap; pointer-events: none; background: var(--overlay); padding: 1px 4px; border-radius: 3px; }
  #tlBake.baking { color: var(--ink); border-color: var(--commit); background: linear-gradient(to right, var(--commit) var(--p,0%), var(--s1) var(--p,0%)); }
  #tlBake.err { color: #fff; background: var(--danger); border-color: var(--danger); }
  #rigbar {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 12;
    display: none; gap: 6px; align-items: center; padding: 7px 9px;
    background: var(--s0); border: 1px solid var(--bd); border-radius: var(--r-md);
    font: 12px/1 ui-sans-serif, system-ui; color: var(--fg-2); backdrop-filter: blur(10px); box-shadow: 0 8px 30px rgba(0,0,0,.3);
  }
  #rigbar.show { display: flex; }
  #rigbar .rl { color: var(--gold); font-weight: 700; margin-right: 2px; letter-spacing: .06em; text-transform: uppercase; font-size: 10px; }
  #rigbar button {
    background: var(--s1); color: var(--fg-2); border: 1px solid var(--bd);
    border-radius: var(--r-sm); padding: 5px 9px; cursor: pointer; font: 12px/1 ui-sans-serif, system-ui;

<script>
  /* Runs before any chrome paints. Share links (?v=) → clean viewer, no password. Everything else (the
     editor) → password gate, unless already unlocked this browser. */
  try {
    if (new URLSearchParams(location.search).get('v')) document.documentElement.classList.add('viewer');
    else if (localStorage.getItem('tg.auth') !== 'ok') document.documentElement.classList.add('locked');
  } catch (e) {}
</script>

<body>
<div id="authGate"><div class="ag-box">
  <div class="ag-logo">MARTELL</div>
  <div class="ag-title">This studio tool is private.</div>
  <input id="agInput" type="password" autocomplete="current-password" placeholder="Password" />
  <button id="agBtn">Enter</button>
  <div id="agErr"></div>
</div></div>
<script>
  /* soft password gate for the editor (share links bypass it via the head guard). Wired here, before the
     heavy module, so it's interactive immediately. NOTE: client-side only — keeps casual visitors out. */
  (function () {
    if (!document.documentElement.classList.contains('locked')) return;
    var H = '14wflb5'; // hash of the password
    function hash(s){var x=5381;for(var i=0;i<s.length;i++)x=((x*33)^s.charCodeAt(i))>>>0;return x.toString(36);}
    var inp = document.getElementById('agInput'), btn = document.getElementById('agBtn'), err = document.getElementById('agErr');
    function tryAuth(){
      if (hash(inp.value) === H) { try { localStorage.setItem('tg.auth', 'ok'); } catch(e){} document.documentElement.classList.remove('locked'); }
      else { err.textContent = 'Incorrect password.'; inp.value = ''; inp.focus(); }
    }
    btn.addEventListener('click', tryAuth);
    inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') tryAuth(); });
    setTimeout(function(){ inp.focus(); }, 60);
  })();
</script>

/* ------------------------------------------------------------------ */
/*  Seeded value/simplex-ish noise                                     */
/* ------------------------------------------------------------------ */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Classic 2D simplex noise with a seeded permutation table.
class SimplexNoise {
  constructor(seed) {
    const rng = mulberry32(seed >>> 0);
    const p = new Uint8Array(256);
    for (let i = 0; i < 256; i++) p[i] = i;
    for (let i = 255; i > 0; i--) {
      const j = (rng() * (i + 1)) | 0;
      [p[i], p[j]] = [p[j], p[i]];
    }
    this.perm = new Uint8Array(512);
    this.permMod12 = new Uint8Array(512);
    for (let i = 0; i < 512; i++) {
      this.perm[i] = p[i & 255];
      this.permMod12[i] = this.perm[i] % 12;
    }
  }
  noise2D(xin, yin) {
    const grad3 = SimplexNoise.grad3;
    const F2 = 0.5 * (Math.sqrt(3) - 1);
    const G2 = (3 - Math.sqrt(3)) / 6;
    const { perm, permMod12 } = this;
    let n0 = 0, n1 = 0, n2 = 0;
    const s = (xin + yin) * F2;
    const i = Math.floor(xin + s);
    const j = Math.floor(yin + s);
    const t = (i + j) * G2;
    const X0 = i - t, Y0 = j - t;
    const x0 = xin - X0, y0 = yin - Y0;
    let i1, j1;
    if (x0 > y0) { i1 = 1; j1 = 0; } else { i1 = 0; j1 = 1; }
    const x1 = x0 - i1 + G2, y1 = y0 - j1 + G2;
    const x2 = x0 - 1 + 2 * G2, y2 = y0 - 1 + 2 * G2;
    const ii = i & 255, jj = j & 255;
    let t0 = 0.5 - x0 * x0 - y0 * y0;
    if (t0 >= 0) { const gi0 = permMod12[ii + perm[jj]] * 3; t0 *= t0; n0 = t0 * t0 * (grad3[gi0] * x0 + grad3[gi0 + 1] * y0); }
    let t1 = 0.5 - x1 * x1 - y1 * y1;
    if (t1 >= 0) { const gi1 = permMod12[ii + i1 + perm[jj + j1]] * 3; t1 *= t1; n1 = t1 * t1 * (grad3[gi1] * x1 + grad3[gi1 + 1] * y1); }
    let t2 = 0.5 - x2 * x2 - y2 * y2;
    if (t2 >= 0) { const gi2 = permMod12[ii + 1 + perm[jj + 1]] * 3; t2 *= t2; n2 = t2 * t2 * (grad3[gi2] * x2 + grad3[gi2 + 1] * y2); }
    return 70 * (n0 + n1 + n2); // ~[-1,1]
  }
}

]);

    uniform float uHorizonY, uMidY, uNoise, uNoiseScale, uBgGlow, uBgGlowSize;

const GradeShader = {
  uniforms: {
    tDiffuse: { value: null },
    uBrightness: { value: 1.0 }, uContrast: { value: 1.0 },
    uSaturation: { value: 1.0 }, uVibrance: { value: 0.0 },
    uTemperature: { value: 0.0 }, uTint: { value: 0.0 },
    uHue: { value: 0.0 }, uGrain: { value: 0.0 }, uTime: { value: 0.0 },

  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uBrightness, uContrast, uSaturation, uVibrance, uTemperature, uTint, uHue, uGrain, uTime, uGain, uNeutral;
    varying vec2 vUv;
    vec3 hueShift(vec3 col, float h){
      const vec3 k = vec3(0.57735);
      float c = cos(h);
      return col * c + cross(k, col) * sin(h) + k * dot(k, col) * (1.0 - c);
    }
    // Khronos PBR Neutral tone mapping — preserves hue & saturation of the
    // endpoint colours (no ACES/Cineon channel cross-contamination).
    vec3 PBRNeutral(vec3 color){
      const float startCompression = 0.8 - 0.04;
      const float desaturation = 0.15;
      float x = min(color.r, min(color.g, color.b));
      float offset = x < 0.08 ? x - 6.25 * x * x : 0.04;
      color -= offset;
      float peak = max(color.r, max(color.g, color.b));
      if (peak < startCompression) return color;
      float d = 1.0 - startCompression;
      float newPeak = 1.0 - d * d / (peak + d - startCompression);
      color *= newPeak / peak;
      float g = 1.0 - 1.0 / (desaturation * (peak - newPeak) + 1.0);
      return mix(color, newPeak * vec3(1.0), g);
    }
    void main(){
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      if (uNeutral > 0.5) c = PBRNeutral(c);
      c *= uBrightness;
      c.r *= 1.0 + uTemperature; c.b *= 1.0 - uTemperature;   // warm/cool
      c.g *= 1.0 + uTint;                                     // green/magenta
      if (abs(uHue) > 0.001) c = hueShift(c, uHue);
      c = (c - 0.5) * uContrast + 0.5;                        // contrast
      float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
      c = mix(vec3(l), c, uSaturation);                      // saturation
      if (abs(uVibrance) > 0.001) {                          // vibrance

const DitherShader = {
  uniforms: { tDiffuse: { value: null }, uAmount: { value: 1.5 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',

    uniform sampler2D tDiffuse; uniform float uAmount; varying vec2 vUv;

/*  Color ramp (duotone-ish, echoing the reference)                    */
/* ------------------------------------------------------------------ */
const ramp = [
  { t: 0.00, c: new THREE.Color(0xffcaa0) }, // warm valley floor
  { t: 0.18, c: new THREE.Color(0xe98b66) },
  { t: 0.42, c: new THREE.Color(0xb24b63) }, // red flank
  { t: 0.66, c: new THREE.Color(0x6a5a9c) }, // purple
  { t: 0.85, c: new THREE.Color(0x5b86d6) }, // blue
  { t: 1.00, c: new THREE.Color(0xeaf2ff) }, // snowy peak
];
const floorColor = new THREE.Color(0xffd9a0);
const tmpA = new THREE.Color(), tmpB = new THREE.Color();
function rampColor(t, out) {
  t = Math.min(1, Math.max(0, t));
  for (let i = 0; i < ramp.length - 1; i++) {
    const a = ramp[i], b = ramp[i + 1];
    if (t <= b.t) {
      const k = (t - a.t) / (b.t - a.t);
      tmpA.copy(a.c); tmpB.copy(b.c);
      return out.copy(tmpA).lerp(tmpB, k);
    }
  }
  return out.copy(ramp[ramp.length - 1].c);
}

/* ------------------------------------------------------------------ */
/*  Terrain build                                                      */
/* ------------------------------------------------------------------ */
let noise = new SimplexNoise(params.seed);

const smoothstep = (e0, e1, x) => {
  const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0)));
  return t * t * (3 - 2 * t);
};

// winding amplitude grows toward the back so the path switchbacks up the mountain
function windFactor(u) {
  return 1 + (params.windGrowthBack - 1) * Math.pow(Math.min(1, Math.max(0, u)), params.windGrowthCurve);
}
// lateral steer that pushes the path to one side as it nears the peak, so it
// routes around the summit instead of climbing straight over it.
function pathSkirt(z) {
  if (!params.peakEnable || !params.peakSkirt) return 0;
  const L = params.length;
  const u = (z + L / 2) / L;
  const spread = Math.max(0.01, (params.peakRadius / L) * 1.1);
  const g = Math.exp(-Math.pow((u - params.peakPos) / spread, 2));
  return params.peakSkirt * params.width * 0.3 * g;
}
// centerline x at a given z. grown=false gives the un-amplified, un-skirted path
// (used to anchor the mountain so the trail winds across it, not moves it).
function pathCenterX(z, grown = true) {
  const L = params.length;
  const u = (z + L / 2) / L; // 0..1 front->back
  const amp = params.windAmplitude * (grown ? windFactor(u) : 1);
  let x = amp * Math.sin(u * Math.PI * 2 * params.windFrequency + params.windPhase);
  if (grown) x += pathSkirt(z);
  const lim = params.width * 0.47;
  return Math.max(-lim, Math.min(lim, x));
}
// rolling up/down altitude offset along the run, sized so the steepest
// section is about `climbGrade` percent (rise / horizontal run).
function altitudeProfile(u, L) {
  const N = params.climbWaves;
  if (params.climbGrade <= 0 || N <= 0) return 0;
  const lambda = L / N;                                    // wavelength (world units)
  const A = (params.climbGrade / 100) * lambda / (2 * Math.PI); // amplitude for that grade
  return A * Math.sin(2 * Math.PI * N * u + params.windPhase);
}

// easing for the base level ramp (0..1 in -> 0..1 out)
function levelEase(u) {
  const p = params.levelCurvePower;
  switch (params.levelCurve) {
    case 'ease-in': return Math.pow(u, p);
    case 'ease-out': return 1 - Math.pow(1 - u, p);
    case 'ease-in-out': return u < 0.5 ? 0.5 * Math.pow(2 * u, p) : 1 - 0.5 * Math.pow(2 * (1 - u), p);
    case 'smoothstep': return u * u * (3 - 2 * u);
    case 'exponential': { const k = p * 2; return (Math.exp(k * u) - 1) / (Math.exp(k) - 1); }
    default: return u; // linear
  }
}

// background mountain: a radial peak at the far end, centred on the path,
// that the dunes and the trail converge into (keeps the path continuous up it)
function peakAt(x, z) {
  if (!params.peakEnable || params.peakHeight <= 0) return 0;
  const L = params.length;
  const cz = -L / 2 + params.peakPos * L;
  const cx = pathCenterX(Math.min(L / 2, cz), false); // anchor mountain to the un-wound path
  const dx = (x - cx) / Math.max(1, params.peakRadius * params.peakAspect);
  const dz = (z - cz) / Math.max(1, params.peakRadius);
  const d = Math.sqrt(dx * dx + dz * dz);
  if (d >= 1) return 0;
  const f = Math.pow(1 - d, params.peakCurve);
  const ridge = 1 + params.peakRidge * (fbm(x, z) - 0.5) * 2;
  return params.peakHeight * f * Math.max(0, ridge);
}

// floor height at a given z: net climb toward the back + rolling up/down
function floorYAt(z) {
  const L = params.length;
  const u = (z + L / 2) / L;
  const ue = Math.min(1, Math.max(0, u)); // clamp so the back extension holds the end level
  return params.floorHeight
    + params.pathSlope * smoothstep(0, 1, u)
    + (params.levelStart + (params.levelEnd - params.levelStart) * levelEase(ue)) // base level ramp
    + altitudeProfile(u, L);
}

// fractal noise in [0,1]
function fbm(x, z) {
  let amp = 1, freq = 1, sum = 0, norm = 0;
  // domain warp so ridges flow rather than look like static blobs
  if (params.warp > 0) {
    const wx = noise.noise2D(x * params.noiseScale * 0.5 + 11.3, z * params.noiseScale * 0.5);
    const wz = noise.noise2D(x * params.noiseScale * 0.5, z * params.noiseScale * 0.5 + 7.7);
    x += wx * params.warp / params.noiseScale * 0.15;
    z += wz * params.warp / params.noiseScale * 0.15;
  }
  for (let o = 0; o < params.octaves; o++) {
    let n = noise.noise2D(x * params.noiseScale * freq, z * params.noiseScale * freq);
    if (params.ridged) { n = 1 - Math.abs(n); n *= n; }
    else { n = n * 0.5 + 0.5; }
    sum += n * amp;
    norm += amp;
    amp *= params.persistence;
    freq *= params.lacunarity;
  }
  let h = sum / norm; // 0..1
  // smoothing>1 rounds the tops (gentle hills); <1 sharpens
  if (params.smoothing !== 1) h = Math.pow(h, params.smoothing);
  return h;
}

// higher-frequency detail layer with selectable noise type
function hash2(x, y) { const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); }
function worley2(x, z, edge) {
  const ix = Math.floor(x), iz = Math.floor(z), fx = x - ix, fz = z - iz;
  let d1 = 9, d2 = 9;
  for (let gz = -1; gz <= 1; gz++) for (let gx = -1; gx <= 1; gx++) {
    const ox = hash2(ix + gx, iz + gz), oz = hash2(ix + gx + 31.4, iz + gz + 17.1);
    const rx = gx + ox - fx, rz = gz + oz - fz, d = rx * rx + rz * rz;
    if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) { d2 = d; }
  }
  return edge ? Math.min(1, Math.sqrt(d2) - Math.sqrt(d1)) : Math.min(1, Math.sqrt(d1));
}
function detailNoise(x, z) {
  const type = params.detailNoiseType;
  let amp = 1, freq = 1, sum = 0, norm = 0;
  const s = params.detailScale / Math.max(0.01, params.detailZoom); // master zoom resizes the whole pattern
  for (let o = 0; o < 3; o++) {
    const px = x * s * freq + 120.5, pz = z * s * freq - 87.3;
    let n;
    if (type === 'cellular') n = 1 - worley2(px, pz, false);
    else if (type === 'cracks') n = worley2(px, pz, true);
    else {
      const sn = noise.noise2D(px, pz); // -1..1
      if (type === 'ridged') { n = 1 - Math.abs(sn); n = n * n; }
      else if (type === 'billow') n = Math.abs(sn);
      else if (type === 'turbulence') { n = Math.abs(sn); n = n * n; }
      else n = sn * 0.5 + 0.5; // fbm
    }
    sum += n * amp; norm += amp; amp *= 0.5; freq *= 2.0;
  }
  return sum / norm;
}

// full height + which fraction of mountain is present (0 on path, 1 on peaks)
function sample(x, z) {
  const cx = pathCenterX(z);
  const dist = Math.abs(x - cx);
  const half = params.pathWidth / 2;
  let valley = smoothstep(half, half + params.wallWidth, dist); // 0 on path, 1 far
  valley = Math.pow(valley, params.wallCurve);
  const floorY = floorYAt(z);
  const gu = Math.min(1, Math.max(0, (z + params.length / 2) / params.length)); // 0 front .. 1 back
  const growth = params.growthFront + (params.growthBack - params.growthFront) * Math.pow(gu, params.growthCurve);
  const mountain = fbm(x, z) * params.mountainHeight * growth;
  // side falloff: relief (and optionally altitude) tapers toward the left/right
  // edges so the landscape resolves naturally instead of cutting off.
  const halfW = params.width * 0.5;
  const swRaw = 1 - smoothstep(halfW * (1 - params.edgeFalloff), halfW, Math.abs(x));
  const sw = Math.pow(swRaw, params.edgeCurve);
  // back falloff: relief/altitude taper toward the far edge to shape the horizon
  const totalLen = params.length + params.backExtend;
  const bu = (z + params.length / 2) / totalLen; // 0 front .. 1 far edge
  const bwRaw = 1 - smoothstep(1 - params.backFalloff, 1.0, bu);
  const bw = Math.pow(bwRaw, params.backCurve);
  const w = sw * bw; // combined relief/peak weight
  const groundNoise = (noise.noise2D(x * 0.08, z * 0.08)) * params.floorNoise;
  const reliefAbove = groundNoise * (1 - valley) + mountain * valley;
  const yDunes = floorY + reliefAbove * w;
  // local height: 0 at the valley floor -> 1 at a full dune peak (excludes the big mountain)
  const denom = params.mountainHeight * Math.max(0.0001, growth);
  const relHeight = Math.min(1, Math.max(0, (reliefAbove * sw) / denom));
  const peakV = peakAt(x, z);
  // fine detail: only on the background mountain (gated by peak presence)
  let detail = 0;
  if (params.detailAmount > 0 && params.peakHeight > 0) {
    const peakN = Math.min(1, peakV / params.peakHeight);
    const mask = Math.min(1, peakN * (1 + params.detailPeakBoost)); // reach down the flanks
    detail = (detailNoise(x, z) - 0.5) * params.detailAmount * valley * w * mask;
  }
  const y = yDunes + peakV * w - (1 - swRaw) * params.edgeDrop - (1 - bwRaw) * params.backDrop + detail;
  return { y, valley, relHeight };
}

const standardMaterial = () => new THREE.MeshStandardMaterial({

const LINE_BLENDS = { add: 0, multiply: 1, screen: 2, overlay: 3, normal: 4, 'color-dodge': 5, lighten: 6, 'soft-light': 7, glow: 8 };
const DUO_MODES = { facing: 0, noise: 1, height: 2 };
const STRIATION_MAPS = { height: 0, lengthwise: 1, across: 2, 'from path': 3, radial: 4, angular: 5, flow: 6, 'path-parallel': 7 };

const TERRAIN_VERT = /* glsl */`
  attribute float aValley;
  attribute float aRelHeight;
  varying vec3 vWorldNormal;
  varying vec3 vWorldPos;
  varying float vValley;
  varying float vY;

const TERRAIN_FRAG = /* glsl */`

  uniform float uLineFreq, uLineWidth, uLineIntensity, uLineFromSurface, uLineBoost, uLineTrailMix, uLineFar, uLineEmissive, uLineFlowScale, uLineFlowWarp, uLineLight, uLineLightPow;
  uniform int uLineBlend, uRimBlend, uLineMap;
  uniform float uMinY, uMaxY, uFogNear, uFogFar, uFogHeight, uFogHeightBand, uFogHeightFade;
  uniform float uHorizonBlend, uHorizonNear, uHorizonFar;
  uniform vec3 uHorizonColor;
  uniform float uValleyFog, uValleyTop, uValleyBottom;
  uniform vec3 uValleyColor;
  uniform float uBlendLo, uBlendHi, uBalance, uRimPower, uRimIntensity;
  uniform float uWindAmp, uWindFreq, uWindPhase, uLen, uWindGrowth, uWindGrowthCurve;
  uniform float uPeakSkirt, uPeakPos, uPeakRadius;
  uniform float uTrailWidth, uTrailSpill, uTrailGlow, uTrailSpacing, uTrailLineWidth, uTrailClear, uTrailStyle, uTrailGap;
  uniform float uTrailMidStr, uTrailDotsOn, uTrailDotInt, uTrailDotCount, uTrailDotSpeed, uTrailShrink, uTrailShrinkCurve;
  uniform vec3 uTrailMid;
  uniform vec3 uLightDir;
  uniform float uSunEnable, uSunIntensity, uAmbient;
  uniform vec3 uSunDir, uSunColor;
  uniform sampler2D uHeightMap;
  uniform float uShadowEnable, uShadowStrength, uShadowDist, uShadowSoft, uShadowBias, uWidth, uShadowHard, uShadowDarken, uZSpan;
  #define SHADOW_STEPS 48
  // heightfield self-shadow: march toward the sun, sampling the baked heights
  float shadowFactor(vec3 wp, vec3 sdir) {
    if (sdir.y <= 0.02) return 1.0;
    float stepLen = uShadowDist / float(SHADOW_STEPS);
    float t = uShadowBias;
    float res = 1.0;
    for (int i = 0; i < SHADOW_STEPS; i++) {
      t += stepLen;
      vec3 p = wp + sdir * t;
      vec2 uv = vec2((p.x + uWidth * 0.5) / uWidth, (p.z + uLen * 0.5) / uZSpan);
      if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) break;
      float h = texture2D(uHeightMap, uv).r;
      float clear = p.y - h;                       // >0 lit, <0 below terrain
      if (uShadowHard > 0.5) {
        if (clear < 0.0) { res = 0.0; break; }     // hard: crisp binary occlusion
      } else {
        res = min(res, clear / (max(0.001, uShadowSoft) * t)); // soft penumbra
        if (res < -0.5) { res = -1.0; break; }
      }
    }
    res = clamp(res, 0.0, 1.0);
    return 1.0 - (1.0 - res) * uShadowStrength;
  }
  uniform int uDuoMode, uDuoNoiseType;
  uniform float uDuoNoiseScale, uDuoNoiseWarp, uDuoHeight, uDuoSeed;
  uniform float uTime, uFlowFog, uFlowIntensity, uFlowDensity, uFlowScale, uFlowSpeed, uFlowReach;
  uniform float uMistInt, uMistHeight, uMistBand, uMistDrift, uMistScale, uMistCov;
  uniform vec3 uMistColor;
  uniform vec3 uFlowColor;
  float h31(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }

               mix(mix(h31(i+vec3(0,0,1)), h31(i+vec3(1,0,1)), f.x),
                   mix(h31(i+vec3(0,1,1)), h31(i+vec3(1,1,1)), f.x), f.y), f.z);
  }
  float fbm3(vec3 p){ float s=0.0,a=0.5; for(int i=0;i<5;i++){ s+=a*vnoise(p); p*=2.02; a*=0.5; } return s; }
  float ridged3(vec3 p){ float s=0.0,a=0.5; for(int i=0;i<5;i++){ float n=1.0-abs(vnoise(p)*2.0-1.0); s+=a*n*n; p*=2.02; a*=0.5; } return s; }

function makeTerrainMaterial(geo) {
  if (params.surfaceStyle !== 'duotone') return standardMaterial();
  return new THREE.ShaderMaterial({
    uniforms: shaderUniforms(geo),
    vertexShader: TERRAIN_VERT,
    fragmentShader: TERRAIN_FRAG,
    wireframe: params.wireframe,
    extensions: { derivatives: true },
  });
}

let terrain = null;
let pathLine = null;
let heightTex = null;
let flowGroup = null;
let flowCurve = null;     // CatmullRom along the centerline, for the camera/runner
let curveLen = 1;

// runner marker (the object that travels the path in your game)
const runner = new THREE.Mesh(
  new THREE.SphereGeometry(1.6, 24, 16),
  new THREE.MeshStandardMaterial({ color: 0xffd089, emissive: 0xffae4d, emissiveIntensity: 1.4, roughness: 0.4 })
);
runner.name = 'Runner';
scene.add(runner);
const runnerGlow = new THREE.PointLight(0xffd089, 8, 60, 2);
runner.add(runnerGlow);
let runT = 0;

/* ------------------------------------------------------------------ */
/*  Traveler character + collectible spheres (from martell-traveler)   */
/* ------------------------------------------------------------------ */
const TRAVELER_FRAG = /* glsl */`
  uniform vec3 uColor; uniform float uIntensity; uniform float uTime; uniform float uSeed;
  varying vec2 vUv;
  void main(){
    float v = vUv.x;
    float fadeRaw = 1.0 - v / 0.85;
    float fade = fadeRaw > 0.0 ? pow(fadeRaw, 1.3) : 0.0;
    float flick = 0.8 + 0.2 * sin(uTime * 3.0 + uSeed * 12.566);
    gl_FragColor = vec4(uColor * uIntensity * flick, fade);
  }`;
const TRAVELER_VERT = /* glsl */`varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
const TRAVELER_UP = new THREE.Vector3(0, 1, 0);

class Traveler {
  constructor(scn, opts = {}) {
    this.head = new THREE.Vector3();
    this.maxHistory = 260;
    this.history = [];
    for (let i = 0; i < this.maxHistory; i++) this.history.push(this.head.clone());
    this.group = new THREE.Group();
    scn.add(this.group);
    this.colorVec = new THREE.Color(opts.color ?? 0xffe6a6);
    this.intensity = 1.0; this.ampMul = 1.0; this.waveSpeedMul = 1.0; this.phaseMul = 1.0;
    this.radius = (opts.thickness ?? 3) * 0.5;
    this.pulses = []; this.pulseAmp = 4.0; this.pulseDur = 1.0; this.pulseWidth = 0.15; this.growDur = 0.6;
    this.segments = 90; this.spacing = 1.1; this.tubeMax = Math.floor(this.segments * 0.85);
    this.maxFilaments = 5;
    this.activeFilaments = Math.min(this.maxFilaments, opts.filamentCount ?? 1);
    this.filaments = [];
    for (let i = 0; i < this.maxFilaments; i++) this.filaments.push(this._makeFilament(i));
    this._applyVisibility();
    this._t = new THREE.Vector3(); this._n = new THREE.Vector3(); this._b = new THREE.Vector3(); this._p = new THREE.Vector3();
  }
  _makeFilament(i) {
    const material = new THREE.ShaderMaterial({
      uniforms: { uColor: { value: this.colorVec }, uIntensity: { value: this.intensity }, uTime: { value: 0 }, uSeed: { value: i / this.maxFilaments } },
      vertexShader: TRAVELER_VERT, fragmentShader: TRAVELER_FRAG,
      transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
    });
    const mesh = new THREE.Mesh(new THREE.BufferGeometry(), material);
    mesh.frustumCulled = false;
    this.group.add(mesh);
    return { mesh, material, pts: [], grow: 1, angle: (i / this.maxFilaments) * Math.PI * 2,
      freq: 0.09 + i * 0.025, speed: 1.2 + i * 0.35, phase: i * 2.3, amp: 1.0 + (i % 3) * 0.45, twist: 0.5 + i * 0.22 };
  }
  resetHistory(point) { this.head.copy(point); this.history.length = 0; for (let k = 0; k < this.maxHistory; k++) this.history.push(point.clone()); this.pulses.length = 0; }
  triggerPulse() { this.pulses.push({ age: 0 }); }
  setFilamentCount(n) { const c = THREE.MathUtils.clamp(Math.round(n), 1, this.maxFilaments); if (c !== this.activeFilaments) { this.activeFilaments = c; this._applyVisibility(); } return this.activeFilaments; }
  _applyVisibility() { this.filaments.forEach((f, i) => { const on = i < this.activeFilaments; if (on && !f.mesh.visible) f.grow = 0; f.mesh.visible = on; }); }
  setColor(hex) { this.colorVec.set(hex); }
  setIntensity(v) { this.intensity = v; }
  setThickness(v) { this.radius = v * 0.5; }
  setHead(pos) { this.head.copy(pos); }
  update(dt, time, buildGeometry = true) {
    for (const pl of this.pulses) pl.age += dt;
    this.pulses = this.pulses.filter((pl) => pl.age < this.pulseDur);
    this.history.unshift(this.head.clone());
    if (this.history.length > this.maxHistory) this.history.pop();
    if (!buildGeometry) return;
    const hist = this.history, tubeMax = this.tubeMax;
    for (let fi = 0; fi < this.activeFilaments; fi++) {
      const f = this.filaments[fi];
      f.grow = Math.min(1, f.grow + dt / Math.max(0.05, this.growDur));
      f.material.uniforms.uTime.value = time;
      f.material.uniforms.uIntensity.value = this.intensity;
      const pts = f.pts; pts.length = 0;
      const jEnd = Math.floor(tubeMax * f.grow);
      for (let j = 0; j <= jEnd; j += 1) {
        const hi = Math.min(hist.length - 1, Math.floor(j * this.spacing));
        const sample = hist[hi];
        const a = hist[Math.max(0, hi - 1)], c = hist[Math.min(hist.length - 1, hi + 1)];
        this._t.subVectors(a, c); if (this._t.lengthSq() < 1e-6) this._t.set(0, 0, 1); this._t.normalize();
        this._n.crossVectors(this._t, TRAVELER_UP); if (this._n.lengthSq() < 1e-6) this._n.set(1, 0, 0); this._n.normalize();
        this._b.crossVectors(this._t, this._n).normalize();
        const u = j / (this.segments - 1);
        const env = Math.sin(u * Math.PI) * (0.4 + 0.6 * (1 - u));
        const wave = Math.sin(j * f.freq + f.phase * this.phaseMul + time * f.speed * this.waveSpeedMul);
        const ang = f.angle + u * f.twist * 6.0 + time * 0.3;
        let radius = f.amp * env * (0.6 + 0.4 * wave) * this.ampMul;
        for (const pl of this.pulses) {
          const front = pl.age / this.pulseDur, d = u - front;
          const g = Math.exp(-(d * d) / (2 * this.pulseWidth * this.pulseWidth));
          radius += g * (1 - pl.age / this.pulseDur) * this.pulseAmp * env * this.ampMul;
        }
        this._p.copy(sample).addScaledVector(this._n, Math.cos(ang) * radius).addScaledVector(this._b, Math.sin(ang) * radius);
        const lastP = pts.length ? pts[pts.length - 1] : null;
        if (!lastP || this._p.distanceToSquared(lastP) > 1e-4) pts.push(this._p.clone());
      }
      if (pts.length >= 3) {
        const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.5);
        const tube = new THREE.TubeGeometry(curve, Math.max(12, pts.length), this.radius, 8, false);
        f.mesh.geometry.dispose(); f.mesh.geometry = tube;
      }
    }
  }
}

const traveler = new Traveler(scene, { color: params.charColor, thickness: params.charThick, filamentCount: 1 });
traveler.group.visible = false;
const sphereGroup = new THREE.Group();
scene.add(sphereGroup);
let spheres = [], collectableCount = 0, collectedCount = 0;
const _side = new THREE.Vector3(), _spp = new THREE.Vector3();

function applyCharacter() {
  traveler.setColor(params.charColor);
  traveler.ampMul = params.charAmp;
  traveler.waveSpeedMul = params.charWaveSpeed;
  traveler.phaseMul = params.charPhase;
  traveler.pulseAmp = params.charPulseAmp;
  traveler.pulseDur = params.charPulseDur;
  traveler.pulseWidth = params.charPulseWidth;
  traveler.growDur = params.charGrowDur;
}

function buildSpheres() {
  for (const s of spheres) { sphereGroup.remove(s.mesh); s.mesh.geometry.dispose(); s.mesh.material.dispose(); }
  spheres = [];
  if (!flowCurve) return;
  const n = Math.max(0, Math.round(params.sphCount));
  const malusFrac = Math.max(0, Math.min(1, params.sphMalusPct / 100));
  for (let i = 0; i < n; i++) {
    const t = (i + 0.5) / n;
    const p = flowCurve.getPointAt(t);
    const base = p.clone(); base.y += params.charFloat; // all on the head's trajectory
    // deterministic pseudo-random spread of malus vs bonus — stable across rebuilds, never clumped
    const hash = Math.abs((Math.sin((i + 1) * 12.9898) * 43758.5453) % 1);
    const malus = hash < malusFrac;
    // bonus = gold sphere; malus = red icosahedron. Both solid, polished, luminescent (emissive blooms).
    const col = new THREE.Color(malus ? params.sphMalusColor : params.sphColor);
    const mat = new THREE.MeshStandardMaterial({
      color: col,
      emissive: col.clone(),
      emissiveIntensity: malus ? params.sphMalusEmissive : params.sphEmissive,
      metalness: malus ? params.sphMalusMetal : params.sphMetal,
      roughness: malus ? params.sphMalusRough : params.sphRough,
      flatShading: malus, // faceted gem look for the icosahedron
    });
    const geo = malus ? new THREE.IcosahedronGeometry(1, 0) : new THREE.SphereGeometry(1, 48, 32);
    const mesh = new THREE.Mesh(geo, mat);
    mesh.renderOrder = 1;
    mesh.position.copy(base);
    if (malus) mesh.rotation.set(hash * 6.2831, i * 1.3, 0); // varied facet orientation
    sphereGroup.add(mesh);
    spheres.push({ mesh, base, phase: i * 1.7, malus, collectable: true, collected: false, popT: 0, startY: base.y });
  }
  collectableCount = spheres.length;
  collectedCount = 0;
}

// warm the trail so it isn't a clump at spawn
function primeTraveler(startT = runT) {
  if (!flowCurve) return;
  // Lay the wake BEHIND the head (toward earlier path positions) so the character spawns with a
  // trail already trailing it — never a clump, and never a streak pointing forward. history[0] is
  // the head (newest); higher indices are older = further back along the path.
  const step = (params.flySpeed / 60) / Math.max(1, curveLen); // path-t advanced per 60fps frame
  const s0 = Math.max(0, Math.min(1, startT));
  const p0 = flowCurve.getPointAt(0);
  const tan0 = flowCurve.getTangentAt(0); // incoming direction, to extrapolate before the start
  const pts = [];
  for (let i = 0; i < traveler.maxHistory; i++) {
    const tt = s0 - i * step; // walk backward from the spawn
    const p = tt >= 0
      ? flowCurve.getPointAt(tt)
      : p0.clone().addScaledVector(tan0, tt * curveLen); // before t=0 → extend backward along the start tangent
    p.y += params.charFloat;
    pts.push(p);
  }
  traveler.history = pts;
  traveler.head.copy(pts[0]);
  traveler.pulses.length = 0;
}

function onPathRebuilt() { applyCharacter(); buildSpheres(); primeTraveler(); }

function updateSpheres(dt, time) {
  const ba = params.sphBreathAmp, bs = params.sphBreathSpeed;
  const PICK_H = params.sphSize * 1.6, PICK_V = params.charFloat * 0.5 + params.sphSize * 2;
  collectedCount = 0;
  for (const s of spheres) {
    if (s.collected) {
      s.popT = Math.min(1, s.popT + dt * 2);
      const e = 1 - Math.pow(1 - s.popT, 3);
      s.mesh.scale.setScalar(Math.max(0, params.sphSize * (1 - e)));
      s.mesh.position.set(s.base.x, s.startY + e * params.sphSize * 2, s.base.z);
      if (s.popT >= 1) s.mesh.visible = false;
      collectedCount++;
      continue;
    }
    s.mesh.scale.setScalar(params.sphSize * (1 + ba * Math.sin(time * bs + s.phase)));
    s.mesh.position.set(s.base.x, s.base.y + params.sphFloatAmp * Math.sin(time * params.sphFloatSpeed + s.phase), s.base.z);
    if (s.malus) { s.mesh.rotation.y += dt * 0.9; s.mesh.rotation.x += dt * 0.35; } // slow gem tumble
    const dx = traveler.head.x - s.mesh.position.x, dz = traveler.head.z - s.mesh.position.z, dy = traveler.head.y - s.mesh.position.y;
    if (Math.hypot(dx, dz) < PICK_H && Math.abs(dy) < PICK_V) {
      s.collected = true; s.popT = 0; s.startY = s.mesh.position.y;
      traveler.triggerPulse();
    }
  }
}
function resetSpheresLap() { for (const s of spheres) { s.collected = false; s.popT = 0; s.mesh.visible = true; } collectedCount = 0; }

function buildTerrain() {
  const t0 = performance.now();
  const { width, length, segmentsX, segmentsZ } = params;
  const nx = segmentsX + 1, nz = segmentsZ + 1;
  const positions = new Float32Array(nx * nz * 3);
  const colors = new Float32Array(nx * nz * 3);
  const uvs = new Float32Array(nx * nz * 2); // planar UVs over the footprint
  const valleys = new Float32Array(nx * nz);  // 0 on path .. 1 far (for the shader)
  const heights = new Float32Array(nx * nz);  // world Y per vertex (shadow heightmap)
  const rels = new Float32Array(nx * nz);     // local relative height (0 floor .. 1 peak)

  const totalLen = length + params.backExtend; // includes the back extension
  const col = new THREE.Color();
  let k = 0, t = 0, vi = 0;
  for (let j = 0; j < nz; j++) {
    const z = -length / 2 + (j / segmentsZ) * totalLen;
    for (let i = 0; i < nx; i++) {
      const x = -width / 2 + (i / segmentsX) * width;
      const { y, valley, relHeight } = sample(x, z);
      positions[k] = x; positions[k + 1] = y; positions[k + 2] = z;

      // color: blend a glowing floor color near the path into the height ramp
      const hRatio = THREE.MathUtils.clamp((y - params.floorHeight) / (params.mountainHeight || 1), 0, 1);
      rampColor(hRatio, col);
      const onPath = 1 - valley; // 1 on path
      col.lerp(floorColor, onPath * 0.85);
      colors[k] = col.r; colors[k + 1] = col.g; colors[k + 2] = col.b;
      uvs[t] = i / segmentsX; uvs[t + 1] = j / segmentsZ;
      valleys[vi] = valley; heights[vi] = y; rels[vi] = relHeight; vi++;
      k += 3; t += 2;
    }
  }

  // indices
  const index = new Uint32Array(segmentsX * segmentsZ * 6);
  let p = 0;
  for (let j = 0; j < segmentsZ; j++) {
    for (let i = 0; i < segmentsX; i++) {
      const a = j * nx + i;
      const b = a + 1;
      const c = a + nx;
      const d = c + 1;
      index[p++] = a; index[p++] = c; index[p++] = b;
      index[p++] = b; index[p++] = c; index[p++] = d;
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  geo.setAttribute('aValley', new THREE.BufferAttribute(valleys, 1));
  geo.setAttribute('aRelHeight', new THREE.BufferAttribute(rels, 1));
  geo.setIndex(new THREE.BufferAttribute(index, 1));
  geo.computeVertexNormals();
  geo.computeBoundingBox();

  const mat = makeTerrainMaterial(geo);

  // bake the height field to a texture for in-shader self-shadowing
  if (heightTex) heightTex.dispose();
  heightTex = new THREE.DataTexture(heights, nx, nz, THREE.RedFormat, THREE.FloatType);
  heightTex.magFilter = THREE.NearestFilter;
  heightTex.minFilter = THREE.NearestFilter;
  heightTex.needsUpdate = true;
  if (mat.isShaderMaterial) {
    mat.uniforms.uHeightMap.value = heightTex;
    mat.uniforms.uWidth.value = width;
    mat.uniforms.uLen.value = length;
  }

  if (terrain) { terrain.geometry.dispose(); terrain.material.dispose(); scene.remove(terrain); }
  terrain = new THREE.Mesh(geo, mat);
  terrain.name = 'Terrain';
  scene.add(terrain);
  if (typeof updateSun === 'function') updateSun();
  buildSkirt(); // low-poly continuation of the dunes out to the horizon (shares this material)

  buildPathLine();
  buildFlowLines();

  // path curve for the camera / runner
  flowCurve = new THREE.CatmullRomCurve3(getCenterlinePoints(200));
  curveLen = flowCurve.getLength();
  if (typeof onPathRebuilt === 'function') onPathRebuilt(); // rebuild spheres + warm the character

  const ms = (performance.now() - t0).toFixed(0);
  const secs = (curveLen / params.flySpeed).toFixed(1);
  setStatus(`${nx * nz} verts · ${segmentsX * segmentsZ * 2} tris · path ${curveLen | 0} m ≈ ${secs}s @ speed ${params.flySpeed} · ${ms} ms`);
}

// A coarse "skirt" grid that continues the heightfield far beyond the main footprint so the
// terrain doesn't end with a hard edge against the sky. Shares the terrain material (so colour,
// duotone, fog and horizon-blend all match and update live). Only the ring outside the footprint
// is tessellated, and it tucks slightly under the main mesh so there's no visible seam.
let skirt = null;
function buildSkirt() {
  if (skirt) { skirt.geometry.dispose(); scene.remove(skirt); skirt = null; }
  if (!params.horizonTerrain || !terrain) return;
  const { width, length } = params;
  const totalLen = length + params.backExtend;
  const ext = Math.max(50, params.horizonExtend);
  const res = Math.max(8, Math.round(params.horizonRes));
  const drop = params.horizonDrop || 0;
  const xMin = -width / 2 - ext, xMax = width / 2 + ext;
  const zMin = -length / 2 - ext, zMax = -length / 2 + totalLen + ext;
  const overlap = Math.max(width, length) * 0.04;       // tuck the skirt under the main terrain
  const fxMin = -width / 2 + overlap, fxMax = width / 2 - overlap;
  const fzMin = -length / 2 + overlap, fzMax = -length / 2 + totalLen - overlap;
  const nx = res + 1, nz = res + 1;
  const positions = new Float32Array(nx * nz * 3);
  const colors = new Float32Array(nx * nz * 3);
  const uvs = new Float32Array(nx * nz * 2);
  const valleys = new Float32Array(nx * nz);
  const rels = new Float32Array(nx * nz);
  const col = new THREE.Color();
  let k = 0, t = 0, vi = 0;
  for (let j = 0; j < nz; j++) {
    const z = zMin + (j / res) * (zMax - zMin);
    for (let i = 0; i < nx; i++) {
      const x = xMin + (i / res) * (xMax - xMin);
      const { y, valley, relHeight } = sample(x, z);
      positions[k] = x; positions[k + 1] = y - drop; positions[k + 2] = z;
      const hRatio = THREE.MathUtils.clamp((y - params.floorHeight) / (params.mountainHeight || 1), 0, 1);
      rampColor(hRatio, col);
      col.lerp(floorColor, (1 - valley) * 0.85);
      colors[k] = col.r; colors[k + 1] = col.g; colors[k + 2] = col.b;
      uvs[t] = (x + width / 2) / width; uvs[t + 1] = (z + length / 2) / totalLen;
      valleys[vi] = valley; rels[vi] = relHeight; vi++;
      k += 3; t += 2;
    }
  }
  const idx = [];
  for (let j = 0; j < res; j++) {
    for (let i = 0; i < res; i++) {
      const cx = xMin + ((i + 0.5) / res) * (xMax - xMin);
      const cz = zMin + ((j + 0.5) / res) * (zMax - zMin);
      if (cx > fxMin && cx < fxMax && cz > fzMin && cz < fzMax) continue; // skip the main footprint
      const a = j * nx + i, b = a + 1, c = a + nx, d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  geo.setAttribute('aValley', new THREE.BufferAttribute(valleys, 1));
  geo.setAttribute('aRelHeight', new THREE.BufferAttribute(rels, 1));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  skirt = new THREE.Mesh(geo, terrain.material); // share material → identical look + live updates
  skirt.name = 'TerrainSkirt';
  skirt.renderOrder = -1;
  scene.add(skirt);
}

function getCenterlinePoints(n = 400) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const z = -params.length / 2 + (i / n) * params.length;
    const x = pathCenterX(z);
    const y = floorYAt(z) + peakAt(x, z) + 0.6; // climb the mountain too
    pts.push(new THREE.Vector3(x, y, z));
  }
  return pts;
}

function buildPathLine() {
  if (pathLine) { pathLine.geometry.dispose(); pathLine.material.dispose(); scene.remove(pathLine); pathLine = null; }
  if (!params.showPath) return;
  const pts = getCenterlinePoints(400);
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  const m = new THREE.LineBasicMaterial({ color: 0xffd089 });
  pathLine = new THREE.Line(g, m);
  pathLine.name = 'PathCenterline';
  scene.add(pathLine);
}

// One shared gold material for all flow lines: comet-like light pulses travel along each line
// (per-vertex arc-length aDist), additive over the scene. uTime is advanced each frame.
let flowLineMat = null;
function getFlowLineMat() {
  if (flowLineMat) return flowLineMat;
  flowLineMat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 }, uColor: { value: new THREE.Color(params.lineGold) },
      uOpacity: { value: params.lineOpacity }, uGlow: { value: params.lineGlow },
      uSpeed: { value: params.lineFlowSpeed }, uFreq: { value: params.linePulses }, uAnim: { value: params.lineAnim ? 1 : 0 },
      uMaskOn: { value: params.lineMaskOn ? 1 : 0 }, uMaskT: { value: params.lineMaskThresh }, uMaskS: { value: params.lineMaskSoft },
    },
    vertexShader: 'attribute float aDist; attribute float aBright; attribute float aMask; varying float vD; varying float vB; varying float vM;\n' +
      'void main(){ vD = aDist; vB = aBright; vM = aMask; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader:
      'uniform float uTime,uOpacity,uGlow,uSpeed,uFreq,uAnim,uMaskOn,uMaskT,uMaskS; uniform vec3 uColor; varying float vD; varying float vB; varying float vM;\n' +
      'void main(){ float m = (uMaskOn > 0.5) ? smoothstep(uMaskT - uMaskS, uMaskT + uMaskS, vM) : 1.0;\n' +
      '  if (m <= 0.002) discard;\n' +
      '  float base = 0.42*vB + 0.18; float glow = 0.0;\n' +
      '  if (uAnim > 0.5){ float seg = fract(vD*uFreq - uTime*uSpeed); float comet = pow(max(0.0,1.0-seg), 7.0); glow = uGlow*comet*(0.55+0.45*vB); }\n' +
      '  gl_FragColor = vec4(uColor*(base+glow), uOpacity*m); }',

}
function updateFlowLineMat() {
  if (!flowLineMat) return;
  const u = flowLineMat.uniforms;
  u.uColor.value.set(params.lineGold);
  u.uOpacity.value = params.lineOpacity; u.uGlow.value = params.lineGlow;
  u.uSpeed.value = params.lineFlowSpeed; u.uFreq.value = params.linePulses; u.uAnim.value = params.lineAnim ? 1 : 0;
  u.uMaskOn.value = params.lineMaskOn ? 1 : 0; u.uMaskT.value = params.lineMaskThresh; u.uMaskS.value = params.lineMaskSoft;

// optional noise mask (0..1) — flow lines fade out where it's below the threshold (built per-vertex)
let _lineMaskGen = null;
function lineMaskAt(x, z) {
  if (!_lineMaskGen) _lineMaskGen = new SimplexNoise(7321);
  const n = _lineMaskGen, s = params.lineMaskScale || 0.02, ty = params.lineMaskType;
  if (ty === 'simplex') return n.noise2D(x * s, z * s) * 0.5 + 0.5;
  if (ty === 'ridged') return 1 - Math.abs(n.noise2D(x * s, z * s));
  if (ty === 'billow') return Math.abs(n.noise2D(x * s, z * s));
  let a = 0, amp = 0.5, f = 1; // fbm
  for (let o = 0; o < 4; o++) { a += n.noise2D(x * s * f + o * 5.1, z * s * f - o * 3.3) * amp; amp *= 0.5; f *= 2; }
